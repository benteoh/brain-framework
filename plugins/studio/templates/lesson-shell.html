<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Studio — Lesson</title>
<style>
  /*
   * lesson-shell: one section shown at a time in a centered carousel card
   * (prev/next + dots), with the conversation panel beside it. Data shape:
   *   {title, sections: [{heading, body, exercisePrompt?}], currentIndex?}
   * currentIndex is optional and only meaningful as an agent-pushed state
   * update (see update.mjs) to auto-advance the carousel; it is not read
   * back from learner navigation.
   * This CSS/JS block is intentionally duplicated across all four shells so
   * each stays independently self-contained (see
   * plugins/studio/skills/studio/SKILL.md).
   */
  :root {
    --bg: #f6f6f4;
    --surface: #ffffff;
    --border: #e2e2de;
    --fg: #1b1b18;
    --muted: #66665f;
    --accent: #0f766e;
    --accent-fg: #ffffff;
    --chip-bg: #eef2f0;
    --chip-fg: #0f766e;
    --chip-border: #cfe3de;
    --danger: #b3261e;
    --live-ok: #1f9d55;
    --live-bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --surface: #1e2024;
      --border: #33353a;
      --fg: #ececea;
      --muted: #a3a39c;
      --accent: #4fd1c5;
      --accent-fg: #0b1f1c;
      --chip-bg: #223330;
      --chip-fg: #7ee8db;
      --chip-border: #2f4a44;
      --danger: #ff6b60;
      --live-ok: #3ddc84;
      --live-bad: #ff6b60;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .page { max-width: 1080px; margin: 0 auto; padding: 1.5rem; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
  h1 { font-size: 1.4rem; margin: 0; }
  .live { font-size: 0.75rem; color: var(--muted); display: flex; align-items: center; gap: 0.35rem; white-space: nowrap; }
  .live-dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--muted); display: inline-block; }
  .live-dot.ok { background: var(--live-ok); }
  .live-dot.bad { background: var(--live-bad); }
  .layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 1.25rem; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.1rem 1.25rem; }
  .carousel { display: flex; flex-direction: column; min-height: 26rem; }
  .carousel-stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0.5rem 0.25rem; }
  .carousel-card { width: 100%; max-width: 34rem; }
  .carousel-counter { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
  .carousel-card h2 { margin: 0 0 0.5rem; font-size: 1.2rem; font-weight: 700; }
  .carousel-card .body p { margin: 0 0 0.6rem; color: var(--fg); }
  .carousel-card .body p:last-child { margin-bottom: 0; }
  .carousel-nav { display: flex; align-items: center; justify-content: center; gap: 1rem; padding-top: 0.85rem; margin-top: 0.5rem; border-top: 1px solid var(--border); }
  .nav-btn {
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--fg);
    font-size: 1.15rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav-btn:hover:not(:disabled) { background: var(--chip-bg); }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .dots { display: flex; align-items: center; gap: 0.4rem; }
  .dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--border); border: none; padding: 0; cursor: pointer; }
  .dot.active { background: var(--accent); }
  .exercise {
    margin-top: 0.6rem;
    padding: 0.6rem 0.8rem;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    border-radius: 0.5rem;
    font-size: 0.92rem;
  }
  .exercise .label { color: var(--chip-fg); font-weight: 600; margin-right: 0.35rem; }
  .exercise-form { display: flex; gap: 0.5rem; margin-top: 0.6rem; }
  .exercise-form input {
    flex: 1;
    padding: 0.45rem 0.6rem;
    border-radius: 0.4rem;
    border: 1px solid var(--chip-border);
    background: var(--surface);
    color: var(--fg);
    font-size: 0.9rem;
  }
  .exercise-form button {
    padding: 0.45rem 0.85rem;
    border-radius: 0.4rem;
    border: none;
    background: var(--accent);
    color: var(--accent-fg);
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .exercise-form button:hover { filter: brightness(1.05); }
  .exercise-sent { margin-top: 0.4rem; font-size: 0.8rem; color: var(--muted); }
  .chat-panel { display: flex; flex-direction: column; height: 100%; min-height: 22rem; }
  .chat-heading { margin: 0 0 0.75rem; font-size: 1rem; font-weight: 600; }
  .chat-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; padding-right: 0.25rem; min-height: 14rem; max-height: 28rem; }
  .chat-entry { padding: 0.5rem 0.7rem; border-radius: 0.6rem; font-size: 0.92rem; max-width: 92%; }
  .chat-entry.chat-learner { align-self: flex-end; background: var(--accent); color: var(--accent-fg); }
  .chat-entry.chat-agent { align-self: flex-start; background: var(--chip-bg); color: var(--fg); }
  .chat-role { display: block; font-size: 0.7rem; opacity: 0.75; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 0.15rem; }
  .chat-form { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
  .chat-form input { flex: 1; padding: 0.55rem 0.7rem; border-radius: 0.5rem; border: 1px solid var(--border); background: var(--bg); color: var(--fg); font-size: 0.95rem; }
  .chat-form button { padding: 0.55rem 1rem; border-radius: 0.5rem; border: none; background: var(--accent); color: var(--accent-fg); font-weight: 600; cursor: pointer; }
  .chat-form button:hover { filter: brightness(1.05); }
  .empty-state { color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1 id="l-title">Loading…</h1>
    <span class="live"><span id="live-dot" class="live-dot"></span><span id="live-label">connecting…</span></span>
  </header>
  <main class="layout">
    <section class="card carousel">
      <div id="l-carousel-stage" class="carousel-stage"></div>
      <div class="carousel-nav">
        <button id="l-prev" type="button" class="nav-btn" aria-label="Previous section">‹</button>
        <div id="l-dots" class="dots"></div>
        <button id="l-next" type="button" class="nav-btn" aria-label="Next section">›</button>
      </div>
    </section>
    <aside class="card chat-panel">
      <h2 class="chat-heading">Conversation</h2>
      <div id="chat-log" class="chat-log"><p class="empty-state">No messages yet.</p></div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" type="text" placeholder="Type your response…" autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </aside>
  </main>
</div>
<script>
(function () {
  'use strict';

  function escapeText(node, text) {
    node.textContent = text == null ? '' : String(text);
  }

  // Minimal, injection-safe markdown: **bold** and _italic_ become real
  // elements via textContent, everything else is a plain text node — no
  // HTML is ever parsed from data, so untrusted content stays inert.
  function appendInline(el, text) {
    const raw = text == null ? '' : String(text);
    const pattern = /\*\*(.+?)\*\*|_(.+?)_/g;
    let lastIndex = 0;
    let match;
    while ((match = pattern.exec(raw)) !== null) {
      if (match.index > lastIndex) {
        el.appendChild(document.createTextNode(raw.slice(lastIndex, match.index)));
      }
      const strong = match[1];
      if (strong !== undefined) {
        const node = document.createElement('strong');
        node.textContent = strong;
        el.appendChild(node);
      } else {
        const node = document.createElement('em');
        node.textContent = match[2];
        el.appendChild(node);
      }
      lastIndex = pattern.lastIndex;
    }
    if (lastIndex < raw.length) {
      el.appendChild(document.createTextNode(raw.slice(lastIndex)));
    }
  }

  // --- Conversation panel: hydrate /transcript, subscribe /events, submit ---
  const chatLog = document.getElementById('chat-log');
  const chatForm = document.getElementById('chat-form');
  const chatInput = document.getElementById('chat-input');
  const liveDot = document.getElementById('live-dot');
  const liveLabel = document.getElementById('live-label');
  let chatStarted = false;

  function clearEmptyState() {
    if (!chatStarted) {
      chatStarted = true;
      chatLog.innerHTML = '';
    }
  }

  function appendChat(entry) {
    clearEmptyState();
    const row = document.createElement('div');
    row.className = 'chat-entry chat-' + (entry.role === 'learner' ? 'learner' : 'agent');
    const roleEl = document.createElement('span');
    roleEl.className = 'chat-role';
    escapeText(roleEl, entry.role);
    const textEl = document.createElement('span');
    escapeText(textEl, entry.text);
    row.appendChild(roleEl);
    row.appendChild(textEl);
    chatLog.appendChild(row);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  async function hydrateTranscript() {
    try {
      const res = await fetch('/transcript');
      const entries = await res.json();
      entries.forEach(appendChat);
    } catch (err) {
      console.error('Could not load transcript', err);
    }
  }

  function subscribeEvents(onState) {
    const source = new EventSource('/events');
    source.onopen = function () {
      liveDot.className = 'live-dot ok';
      liveLabel.textContent = 'live';
    };
    source.onerror = function () {
      liveDot.className = 'live-dot bad';
      liveLabel.textContent = 'reconnecting…';
    };
    source.onmessage = function (event) {
      let msg;
      try {
        msg = JSON.parse(event.data);
      } catch {
        return;
      }
      if (msg.kind === 'chat') {
        appendChat(msg);
      } else if (msg.kind === 'state' && typeof onState === 'function') {
        onState(msg.data);
      }
    };
  }

  function submitText(text) {
    const trimmed = (text || '').trim();
    if (!trimmed) return;
    fetch('/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: trimmed }),
    }).catch(function (err) {
      console.error('Could not submit', err);
    });
  }

  chatForm.addEventListener('submit', function (event) {
    event.preventDefault();
    const text = chatInput.value;
    chatInput.value = '';
    submitText(text);
  });

  // --- Shell-specific: fetch /data, render, react to live state pushes ---
  // One section shown at a time, centered, so a learner focuses on the
  // current phrase/exercise rather than scanning a long list. Data shape
  // gains an optional `currentIndex` the agent can push via update.mjs to
  // advance the carousel after grading an answer; absent a push, the
  // learner drives it with the prev/next controls or the dots.
  const titleEl = document.getElementById('l-title');
  const stageEl = document.getElementById('l-carousel-stage');
  const dotsEl = document.getElementById('l-dots');
  const prevBtn = document.getElementById('l-prev');
  const nextBtn = document.getElementById('l-next');

  let current = { title: '', sections: [] };
  let currentIndex = 0;

  function clampIndex(index, length) {
    if (!length) return 0;
    return Math.min(Math.max(index, 0), length - 1);
  }

  function renderCard() {
    const sections = Array.isArray(current.sections) ? current.sections : [];
    stageEl.innerHTML = '';
    dotsEl.innerHTML = '';

    if (!sections.length) {
      const empty = document.createElement('p');
      empty.className = 'empty-state';
      empty.textContent = 'No content yet.';
      stageEl.appendChild(empty);
      prevBtn.disabled = true;
      nextBtn.disabled = true;
      return;
    }

    currentIndex = clampIndex(currentIndex, sections.length);
    const section = sections[currentIndex];

    const card = document.createElement('div');
    card.className = 'carousel-card';

    const counter = document.createElement('div');
    counter.className = 'carousel-counter';
    counter.textContent = 'Section ' + (currentIndex + 1) + ' of ' + sections.length;
    card.appendChild(counter);

    const heading = document.createElement('h2');
    escapeText(heading, section.heading || '');
    card.appendChild(heading);

    const body = document.createElement('div');
    body.className = 'body';
    String(section.body || '').split(/\n{2,}/).forEach(function (para) {
      if (!para.trim()) return;
      const p = document.createElement('p');
      appendInline(p, para.trim());
      body.appendChild(p);
    });
    card.appendChild(body);

    if (section.exercisePrompt) {
      const exercise = document.createElement('div');
      exercise.className = 'exercise';
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = 'Try it:';
      const text = document.createElement('span');
      appendInline(text, section.exercisePrompt);
      exercise.appendChild(label);
      exercise.appendChild(text);

      const form = document.createElement('form');
      form.className = 'exercise-form';
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Your answer…';
      input.autocomplete = 'off';
      const button = document.createElement('button');
      button.type = 'submit';
      button.textContent = 'Send';
      form.appendChild(input);
      form.appendChild(button);
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        const value = input.value;
        input.value = '';
        submitText(value);
      });
      exercise.appendChild(form);

      card.appendChild(exercise);
    }

    stageEl.appendChild(card);

    sections.forEach(function (_, index) {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'dot' + (index === currentIndex ? ' active' : '');
      dot.setAttribute('aria-label', 'Go to section ' + (index + 1));
      dot.addEventListener('click', function () {
        currentIndex = index;
        renderCard();
      });
      dotsEl.appendChild(dot);
    });

    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === sections.length - 1;
  }

  prevBtn.addEventListener('click', function () {
    currentIndex = clampIndex(currentIndex - 1, (current.sections || []).length);
    renderCard();
  });
  nextBtn.addEventListener('click', function () {
    currentIndex = clampIndex(currentIndex + 1, (current.sections || []).length);
    renderCard();
  });

  function render() {
    document.title = 'Studio — ' + (current.title || 'Lesson');
    escapeText(titleEl, current.title || 'Lesson');
    renderCard();
  }

  async function loadData() {
    try {
      const res = await fetch('/data');
      if (!res.ok) return;
      const data = await res.json();
      current = Object.assign(current, data);
      if (typeof data.currentIndex === 'number') currentIndex = data.currentIndex;
      render();
    } catch (err) {
      console.error('Could not load /data', err);
    }
  }

  function onState(data) {
    // A live state push replaces whichever fields it carries (e.g. a newly
    // generated section, or currentIndex to advance the carousel after
    // grading an answer) without a full page reload.
    current = Object.assign({}, current, data || {});
    if (data && typeof data.currentIndex === 'number') currentIndex = data.currentIndex;
    render();
  }

  hydrateTranscript();
  subscribeEvents(onState);
  loadData();
})();
</script>
</body>
</html>
