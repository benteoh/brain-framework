<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Studio — Board</title>
<style>
  /*
   * board-shell: a chessboard rendered from a FEN string (inline SVG, no
   * image assets), click-to-select-piece then click-destination-square move
   * input, illegal destinations never offered. Data shape:
   *   {title, context, prompt, orientation: 'white'|'black'}, state: {fen}
   * A legal move POSTs {text: <SAN>} to /submit and optimistically
   * re-renders locally; the agent confirms/corrects the authoritative
   * position by pushing a new FEN via update.mjs, delivered here as a
   * {kind:'state', data:{fen}} event over /events. chess.js is vendored
   * inline below for legal-move generation/validation only (no CDN, no
   * runtime npm dependency for the page itself) — see the license block
   * inside that script for attribution. This CSS/JS block is intentionally
   * duplicated across all four shells so each stays independently
   * self-contained (see plugins/studio/skills/studio/SKILL.md).
   */
  :root {
    --bg: #f6f6f4;
    --surface: #ffffff;
    --border: #e2e2de;
    --fg: #1b1b18;
    --muted: #66665f;
    --accent: #0f766e;
    --accent-fg: #ffffff;
    --chip-bg: #eef2f0;
    --chip-fg: #0f766e;
    --chip-border: #cfe3de;
    --danger: #b3261e;
    --live-ok: #1f9d55;
    --live-bad: #b3261e;
    --sq-light: #ebecd0;
    --sq-dark: #739552;
    --sq-selected: #f2c94c;
    --sq-legal: rgba(15, 118, 110, 0.55);
    --sq-legal-capture: rgba(179, 38, 30, 0.55);
    --board-border: #33352f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --surface: #1e2024;
      --border: #33353a;
      --fg: #ececea;
      --muted: #a3a39c;
      --accent: #4fd1c5;
      --accent-fg: #0b1f1c;
      --chip-bg: #223330;
      --chip-fg: #7ee8db;
      --chip-border: #2f4a44;
      --danger: #ff6b60;
      --live-ok: #3ddc84;
      --live-bad: #ff6b60;
      --sq-light: #b3bd9a;
      --sq-dark: #55704a;
      --sq-selected: #e0b23a;
      --sq-legal: rgba(79, 209, 197, 0.55);
      --sq-legal-capture: rgba(255, 107, 96, 0.55);
      --board-border: #0c0d0f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .page { max-width: 1180px; margin: 0 auto; padding: 1.5rem; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
  h1 { font-size: 1.4rem; margin: 0; }
  .live { font-size: 0.75rem; color: var(--muted); display: flex; align-items: center; gap: 0.35rem; white-space: nowrap; }
  .live-dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--muted); display: inline-block; }
  .live-dot.ok { background: var(--live-ok); }
  .live-dot.bad { background: var(--live-bad); }
  .layout { display: grid; grid-template-columns: 1.3fr 1fr; gap: 1.25rem; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.1rem 1.25rem; }
  .context { color: var(--muted); margin: 0 0 0.75rem; }
  .prompt-card h2 { margin: 0 0 0.75rem; font-size: 1.1rem; font-weight: 600; }
  .board-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; }
  .board-svg { width: 100%; max-width: 30rem; height: auto; touch-action: manipulation; }
  .board-svg rect.square { cursor: pointer; }
  .board-svg use.piece { cursor: pointer; }
  .board-status { font-size: 0.9rem; color: var(--muted); min-height: 1.3rem; text-align: center; }
  .board-status.warn { color: var(--danger); font-weight: 600; }
  .promotion-picker { display: flex; gap: 0.5rem; justify-content: center; }
  .promotion-picker button {
    font-size: 1.4rem;
    padding: 0.3rem 0.6rem;
    border-radius: 0.5rem;
    border: 1px solid var(--chip-border);
    background: var(--chip-bg);
    color: var(--chip-fg);
    cursor: pointer;
  }
  .promotion-picker button:hover { filter: brightness(1.05); }
  .chat-panel { display: flex; flex-direction: column; height: 100%; min-height: 22rem; }
  .chat-heading { margin: 0 0 0.75rem; font-size: 1rem; font-weight: 600; }
  .chat-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; padding-right: 0.25rem; min-height: 14rem; max-height: 28rem; }
  .chat-entry { padding: 0.5rem 0.7rem; border-radius: 0.6rem; font-size: 0.92rem; max-width: 92%; }
  .chat-entry.chat-learner { align-self: flex-end; background: var(--accent); color: var(--accent-fg); }
  .chat-entry.chat-agent { align-self: flex-start; background: var(--chip-bg); color: var(--fg); }
  .chat-role { display: block; font-size: 0.7rem; opacity: 0.75; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 0.15rem; }
  .chat-form { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
  .chat-form input { flex: 1; padding: 0.55rem 0.7rem; border-radius: 0.5rem; border: 1px solid var(--border); background: var(--bg); color: var(--fg); font-size: 0.95rem; }
  .chat-form button { padding: 0.55rem 1rem; border-radius: 0.5rem; border: none; background: var(--accent); color: var(--accent-fg); font-weight: 600; cursor: pointer; }
  .chat-form button:hover { filter: brightness(1.05); }
  .empty-state { color: var(--muted); font-size: 0.9rem; }
</style>
</head>

    var us = turn
    var them = swap_color(us)
    var second_rank = { b: RANK_7, w: RANK_2 }

    var first_sq = SQUARE_MAP.a8
    var last_sq = SQUARE_MAP.h1
    var single_square = false

    /* do we want legal moves? */
    var legal =
      typeof options !== 'undefined' && 'legal' in options
        ? options.legal
        : true

    var piece_type =
      typeof options !== 'undefined' &&
      'piece' in options &&
      typeof options.piece === 'string'
        ? options.piece.toLowerCase()
        : true

    /* are we generating moves for a single square? */
    if (typeof options !== 'undefined' && 'square' in options) {
      if (options.square in SQUARE_MAP) {
        first_sq = last_sq = SQUARE_MAP[options.square]
        single_square = true
      } else {
        /* invalid square */
        return []
      }
    }

    for (var i = first_sq; i <= last_sq; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece == null || piece.color !== us) {
        continue
      }

      if (piece.type === PAWN && (piece_type === true || piece_type === PAWN)) {
        /* single square, non-capturing */
        var square = i + PAWN_OFFSETS[us][0]
        if (board[square] == null) {
          add_move(board, moves, i, square, BITS.NORMAL)

          /* double square */
          var square = i + PAWN_OFFSETS[us][1]
          if (second_rank[us] === rank(i) && board[square] == null) {
            add_move(board, moves, i, square, BITS.BIG_PAWN)
          }
        }

        /* pawn captures */
        for (j = 2; j < 4; j++) {
          var square = i + PAWN_OFFSETS[us][j]
          if (square & 0x88) continue

          if (board[square] != null && board[square].color === them) {
            add_move(board, moves, i, square, BITS.CAPTURE)
          } else if (square === ep_square) {
            add_move(board, moves, i, ep_square, BITS.EP_CAPTURE)
          }
        }
      } else if (piece_type === true || piece_type === piece.type) {
        for (var j = 0, len = PIECE_OFFSETS[piece.type].length; j < len; j++) {
          var offset = PIECE_OFFSETS[piece.type][j]
          var square = i

          while (true) {
            square += offset
            if (square & 0x88) break

            if (board[square] == null) {
              add_move(board, moves, i, square, BITS.NORMAL)
            } else {
              if (board[square].color === us) break
              add_move(board, moves, i, square, BITS.CAPTURE)
              break
            }

            /* break, if knight or king */
            if (piece.type === 'n' || piece.type === 'k') break
          }
        }
      }
    }

    /* check for castling if: a) we're generating all moves, or b) we're doing
     * single square move generation on the king's square
     */
    if (piece_type === true || piece_type === KING) {
      if (!single_square || last_sq === kings[us]) {
        /* king-side castling */
        if (castling[us] & BITS.KSIDE_CASTLE) {
          var castling_from = kings[us]
          var castling_to = castling_from + 2

          if (
            board[castling_from + 1] == null &&
            board[castling_to] == null &&
            !attacked(them, kings[us]) &&
            !attacked(them, castling_from + 1) &&
            !attacked(them, castling_to)
          ) {
            add_move(board, moves, kings[us], castling_to, BITS.KSIDE_CASTLE)
          }
        }

        /* queen-side castling */
        if (castling[us] & BITS.QSIDE_CASTLE) {
          var castling_from = kings[us]
          var castling_to = castling_from - 2

          if (
            board[castling_from - 1] == null &&
            board[castling_from - 2] == null &&
            board[castling_from - 3] == null &&
            !attacked(them, kings[us]) &&
            !attacked(them, castling_from - 1) &&
            !attacked(them, castling_to)
          ) {
            add_move(board, moves, kings[us], castling_to, BITS.QSIDE_CASTLE)
          }
        }
      }
    }

    /* return all pseudo-legal moves (this includes moves that allow the king
     * to be captured)
     */
    if (!legal) {
      return moves
    }

    /* filter out illegal moves */
    var legal_moves = []
    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(us)) {
        legal_moves.push(moves[i])
      }
      undo_move()
    }

    return legal_moves
  }

  /* convert a move from 0x88 coordinates to Standard Algebraic Notation
   * (SAN)
   *
   * @param {boolean} sloppy Use the sloppy SAN generator to work around over
   * disambiguation bugs in Fritz and Chessbase.  See below:
   *
   * r1bqkbnr/ppp2ppp/2n5/1B1pP3/4P3/8/PPPP2PP/RNBQK1NR b KQkq - 2 4
   * 4. ... Nge7 is overly disambiguated because the knight on c6 is pinned
   * 4. ... Ne7 is technically the valid SAN
   */
  function move_to_san(move, moves) {
    var output = ''

    if (move.flags & BITS.KSIDE_CASTLE) {
      output = 'O-O'
    } else if (move.flags & BITS.QSIDE_CASTLE) {
      output = 'O-O-O'
    } else {
      if (move.piece !== PAWN) {
        var disambiguator = get_disambiguator(move, moves)
        output += move.piece.toUpperCase() + disambiguator
      }

      if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
        if (move.piece === PAWN) {
          output += algebraic(move.from)[0]
        }
        output += 'x'
      }

      output += algebraic(move.to)

      if (move.flags & BITS.PROMOTION) {
        output += '=' + move.promotion.toUpperCase()
      }
    }

    make_move(move)
    if (in_check()) {
      if (in_checkmate()) {
        output += '#'
      } else {
        output += '+'
      }
    }
    undo_move()

    return output
  }

  function attacked(color, square) {
    for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      /* if empty square or wrong color */
      if (board[i] == null || board[i].color !== color) continue

      var piece = board[i]
      var difference = i - square
      var index = difference + 119

      if (ATTACKS[index] & (1 << SHIFTS[piece.type])) {
        if (piece.type === PAWN) {
          if (difference > 0) {
            if (piece.color === WHITE) return true
          } else {
            if (piece.color === BLACK) return true
          }
          continue
        }

        /* if the piece is a knight or a king */
        if (piece.type === 'n' || piece.type === 'k') return true

        var offset = RAYS[index]
        var j = i + offset

        var blocked = false
        while (j !== square) {
          if (board[j] != null) {
            blocked = true
            break
          }
          j += offset
        }

        if (!blocked) return true
      }
    }

    return false
  }

  function king_attacked(color) {
    return attacked(swap_color(color), kings[color])
  }

  function in_check() {
    return king_attacked(turn)
  }

  function in_checkmate() {
    return in_check() && generate_moves().length === 0
  }

  function in_stalemate() {
    return !in_check() && generate_moves().length === 0
  }

  function insufficient_material() {
    var pieces = {}
    var bishops = []
    var num_pieces = 0
    var sq_color = 0

    for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
      sq_color = (sq_color + 1) % 2
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece) {
        pieces[piece.type] = piece.type in pieces ? pieces[piece.type] + 1 : 1
        if (piece.type === BISHOP) {
          bishops.push(sq_color)
        }
        num_pieces++
      }
    }

    /* k vs. k */
    if (num_pieces === 2) {
      return true
    } else if (
      /* k vs. kn .... or .... k vs. kb */
      num_pieces === 3 &&
      (pieces[BISHOP] === 1 || pieces[KNIGHT] === 1)
    ) {
      return true
    } else if (num_pieces === pieces[BISHOP] + 2) {
      /* kb vs. kb where any number of bishops are all on the same color */
      var sum = 0
      var len = bishops.length
      for (var i = 0; i < len; i++) {
        sum += bishops[i]
      }
      if (sum === 0 || sum === len) {
        return true
      }
    }

    return false
  }

  function in_threefold_repetition() {
    /* TODO: while this function is fine for casual use, a better
     * implementation would use a Zobrist key (instead of FEN). the
     * Zobrist key would be maintained in the make_move/undo_move functions,
     * avoiding the costly that we do below.
     */
    var moves = []
    var positions = {}
    var repetition = false

    while (true) {
      var move = undo_move()
      if (!move) break
      moves.push(move)
    }

    while (true) {
      /* remove the last two fields in the FEN string, they're not needed
       * when checking for draw by rep */
      var fen = generate_fen().split(' ').slice(0, 4).join(' ')

      /* has the position occurred three or move times */
      positions[fen] = fen in positions ? positions[fen] + 1 : 1
      if (positions[fen] >= 3) {
        repetition = true
      }

      if (!moves.length) {
        break
      }
      make_move(moves.pop())
    }

    return repetition
  }

  function push(move) {
    history.push({
      move: move,
      kings: { b: kings.b, w: kings.w },
      turn: turn,
      castling: { b: castling.b, w: castling.w },
      ep_square: ep_square,
      half_moves: half_moves,
      move_number: move_number,
    })
  }

  function make_move(move) {
    var us = turn
    var them = swap_color(us)
    push(move)

    board[move.to] = board[move.from]
    board[move.from] = null

    /* if ep capture, remove the captured pawn */
    if (move.flags & BITS.EP_CAPTURE) {
      if (turn === BLACK) {
        board[move.to - 16] = null
      } else {
        board[move.to + 16] = null
      }
    }

    /* if pawn promotion, replace with new piece */
    if (move.flags & BITS.PROMOTION) {
      board[move.to] = { type: move.promotion, color: us }
    }

    /* if we moved the king */
    if (board[move.to].type === KING) {
      kings[board[move.to].color] = move.to

      /* if we castled, move the rook next to the king */
      if (move.flags & BITS.KSIDE_CASTLE) {
        var castling_to = move.to - 1
        var castling_from = move.to + 1
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        var castling_to = move.to + 1
        var castling_from = move.to - 2
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      }

      /* turn off castling */
      castling[us] = ''
    }

    /* turn off castling if we move a rook */
    if (castling[us]) {
      for (var i = 0, len = ROOKS[us].length; i < len; i++) {
        if (
          move.from === ROOKS[us][i].square &&
          castling[us] & ROOKS[us][i].flag
        ) {
          castling[us] ^= ROOKS[us][i].flag
          break
        }
      }
    }

    /* turn off castling if we capture a rook */
    if (castling[them]) {
      for (var i = 0, len = ROOKS[them].length; i < len; i++) {
        if (
          move.to === ROOKS[them][i].square &&
          castling[them] & ROOKS[them][i].flag
        ) {
          castling[them] ^= ROOKS[them][i].flag
          break
        }
      }
    }

    /* if big pawn move, update the en passant square */
    if (move.flags & BITS.BIG_PAWN) {
      if (turn === 'b') {
        ep_square = move.to - 16
      } else {
        ep_square = move.to + 16
      }
    } else {
      ep_square = EMPTY
    }

    /* reset the 50 move counter if a pawn is moved or a piece is captured */
    if (move.piece === PAWN) {
      half_moves = 0
    } else if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
      half_moves = 0
    } else {
      half_moves++
    }

    if (turn === BLACK) {
      move_number++
    }
    turn = swap_color(turn)
  }

  function undo_move() {
    var old = history.pop()
    if (old == null) {
      return null
    }

    var move = old.move
    kings = old.kings
    turn = old.turn
    castling = old.castling
    ep_square = old.ep_square
    half_moves = old.half_moves
    move_number = old.move_number

    var us = turn
    var them = swap_color(turn)

    board[move.from] = board[move.to]
    board[move.from].type = move.piece // to undo any promotions
    board[move.to] = null

    if (move.flags & BITS.CAPTURE) {
      board[move.to] = { type: move.captured, color: them }
    } else if (move.flags & BITS.EP_CAPTURE) {
      var index
      if (us === BLACK) {
        index = move.to - 16
      } else {
        index = move.to + 16
      }
      board[index] = { type: PAWN, color: them }
    }

    if (move.flags & (BITS.KSIDE_CASTLE | BITS.QSIDE_CASTLE)) {
      var castling_to, castling_from
      if (move.flags & BITS.KSIDE_CASTLE) {
        castling_to = move.to + 1
        castling_from = move.to - 1
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        castling_to = move.to - 2
        castling_from = move.to + 1
      }

      board[castling_to] = board[castling_from]
      board[castling_from] = null
    }

    return move
  }

  // convert a move from Standard Algebraic Notation (SAN) to 0x88 coordinates
  function move_from_san(move, sloppy) {
    // strip off any move decorations: e.g Nf3+?! becomes Nf3
    var clean_move = stripped_san(move)

    // the move parsers is a 2-step state
    for (var parser = 0; parser < 2; parser++) {
      if (parser == PARSER_SLOPPY) {
        // only run the sloppy parse if explicitly requested
        if (!sloppy) {
          return null
        }

        // The sloppy parser allows the user to parse non-standard chess
        // notations. This parser is opt-in (by specifying the
        // '{ sloppy: true }' setting) and is only run after the Standard
        // Algebraic Notation (SAN) parser has failed.
        //
        // When running the sloppy parser, we'll run a regex to grab the piece,
        // the to/from square, and an optional promotion piece. This regex will
        // parse common non-standard notation like: Pe2-e4, Rc1c4, Qf3xf7,
        // f7f8q, b1c3

        // NOTE: Some positions and moves may be ambiguous when using the
        // sloppy parser. For example, in this position:
        // 6k1/8/8/B7/8/8/8/BN4K1 w - - 0 1, the move b1c3 may be interpreted
        // as Nc3 or B1c3 (a disambiguated bishop move). In these cases, the
        // sloppy parser will default to the most most basic interpretation
        // (which is b1c3 parsing to Nc3).

        // FIXME: these var's are hoisted into function scope, this will need
        // to change when switching to const/let

        var overly_disambiguated = false

        var matches = clean_move.match(
          /([pnbrqkPNBRQK])?([a-h][1-8])x?-?([a-h][1-8])([qrbnQRBN])?/
        )
        if (matches) {
          var piece = matches[1]
          var from = matches[2]
          var to = matches[3]
          var promotion = matches[4]

          if (from.length == 1) {
            overly_disambiguated = true
          }
        } else {
          // The [a-h]?[1-8]? portion of the regex below handles moves that may
          // be overly disambiguated (e.g. Nge7 is unnecessary and non-standard
          // when there is one legal knight move to e7). In this case, the value
          // of 'from' variable will be a rank or file, not a square.
          var matches = clean_move.match(
            /([pnbrqkPNBRQK])?([a-h]?[1-8]?)x?-?([a-h][1-8])([qrbnQRBN])?/
          )

          if (matches) {
            var piece = matches[1]
            var from = matches[2]
            var to = matches[3]
            var promotion = matches[4]

            if (from.length == 1) {
              var overly_disambiguated = true
            }
          }
        }
      }

      var piece_type = infer_piece_type(clean_move)
      var moves = generate_moves({
        legal: true,
        piece: piece ? piece : piece_type,
      })

      for (var i = 0, len = moves.length; i < len; i++) {
        switch (parser) {
          case PARSER_STRICT: {
            if (clean_move === stripped_san(move_to_san(moves[i], moves))) {
              return moves[i]
            }
            break
          }
          case PARSER_SLOPPY: {
            if (matches) {
              // hand-compare move properties with the results from our sloppy
              // regex
              if (
                (!piece || piece.toLowerCase() == moves[i].piece) &&
                SQUARE_MAP[from] == moves[i].from &&
                SQUARE_MAP[to] == moves[i].to &&
                (!promotion || promotion.toLowerCase() == moves[i].promotion)
              ) {
                return moves[i]
              } else if (overly_disambiguated) {
                // SPECIAL CASE: we parsed a move string that may have an
                // unneeded rank/file disambiguator (e.g. Nge7).  The 'from'
                // variable will
                var square = algebraic(moves[i].from)
                if (
                  (!piece || piece.toLowerCase() == moves[i].piece) &&
                  SQUARE_MAP[to] == moves[i].to &&
                  (from == square[0] || from == square[1]) &&
                  (!promotion || promotion.toLowerCase() == moves[i].promotion)
                ) {
                  return moves[i]
                }
              }
            }
          }
        }
      }
    }

    return null
  }

  /* pretty = external move object */
  function make_pretty(ugly_move) {
    var move = clone(ugly_move)
    move.san = move_to_san(move, generate_moves({ legal: true }))
    move.to = algebraic(move.to)
    move.from = algebraic(move.from)

    var flags = ''

    for (var flag in BITS) {
      if (BITS[flag] & move.flags) {
        flags += FLAGS[flag]
      }
    }
    move.flags = flags

    return move
  }

  /*****************************************************************************
   * DEBUGGING UTILITIES
   ****************************************************************************/
  function perft(depth) {
    var moves = generate_moves({ legal: false })
    var nodes = 0
    var color = turn

    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(color)) {
        if (depth - 1 > 0) {
          var child_nodes = perft(depth - 1)
          nodes += child_nodes
        } else {
          nodes++
        }
      }
      undo_move()
    }

    return nodes
  }

  return {
    /***************************************************************************
     * PUBLIC API
     **************************************************************************/
    load: function (fen) {
      return load(fen)
    },

    reset: function () {
      return reset()
    },

    moves: function (options) {
      /* The internal representation of a chess move is in 0x88 format, and
       * not meant to be human-readable.  The code below converts the 0x88
       * square coordinates to algebraic coordinates.  It also prunes an
       * unnecessary move keys resulting from a verbose call.
       */

      var ugly_moves = generate_moves(options)
      var moves = []

      for (var i = 0, len = ugly_moves.length; i < len; i++) {
        /* does the user want a full move object (most likely not), or just
         * SAN
         */
        if (
          typeof options !== 'undefined' &&
          'verbose' in options &&
          options.verbose
        ) {
          moves.push(make_pretty(ugly_moves[i]))
        } else {
          moves.push(
            move_to_san(ugly_moves[i], generate_moves({ legal: true }))
          )
        }
      }

      return moves
    },

    in_check: function () {
      return in_check()
    },

    in_checkmate: function () {
      return in_checkmate()
    },

    in_stalemate: function () {
      return in_stalemate()
    },

    in_draw: function () {
      return (
        half_moves >= 100 ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()
      )
    },

    insufficient_material: function () {
      return insufficient_material()
    },

    in_threefold_repetition: function () {
      return in_threefold_repetition()
    },

    game_over: function () {
      return (
        half_moves >= 100 ||
        in_checkmate() ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()
      )
    },

    validate_fen: function (fen) {
      return validate_fen(fen)
    },

    fen: function () {
      return generate_fen()
    },

    board: function () {
      var output = [],
        row = []

      for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
        if (board[i] == null) {
          row.push(null)
        } else {
          row.push({
            square: algebraic(i),
            type: board[i].type,
            color: board[i].color,
          })
        }
        if ((i + 1) & 0x88) {
          output.push(row)
          row = []
          i += 8
        }
      }

      return output
    },

    header: function () {
      return set_header(arguments)
    },

    turn: function () {
      return turn
    },

    move: function (move, options) {
      /* The move function can be called with in the following parameters:
       *
       * .move('Nxb7')      <- where 'move' is a case-sensitive SAN string
       *
       * .move({ from: 'h7', <- where the 'move' is a move object (additional
       *         to :'h8',      fields are ignored)
       *         promotion: 'q',
       *      })
       */

      // allow the user to specify the sloppy move parser to work around over
      // disambiguation bugs in Fritz and Chessbase
      var sloppy =
        typeof options !== 'undefined' && 'sloppy' in options
          ? options.sloppy
          : false

      var move_obj = null

      if (typeof move === 'string') {
        move_obj = move_from_san(move, sloppy)
      } else if (typeof move === 'object') {
        var moves = generate_moves()

        /* convert the pretty move object to an ugly move object */
        for (var i = 0, len = moves.length; i < len; i++) {
          if (
            move.from === algebraic(moves[i].from) &&
            move.to === algebraic(moves[i].to) &&
            (!('promotion' in moves[i]) ||
              move.promotion === moves[i].promotion)
          ) {
            move_obj = moves[i]
            break
          }
        }
      }

      /* failed to find move */
      if (!move_obj) {
        return null
      }

      /* need to make a copy of move because we can't generate SAN after the
       * move is made
       */
      var pretty_move = make_pretty(move_obj)

      make_move(move_obj)

      return pretty_move
    },

    undo: function () {
      var move = undo_move()
      return move ? make_pretty(move) : null
    },

    clear: function () {
      return clear()
    },

    put: function (piece, square) {
      return put(piece, square)
    },

    get: function (square) {
      return get(square)
    },

    ascii() {
      var s = '   +------------------------+\n'
      for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
        /* display the rank */
        if (file(i) === 0) {
          s += ' ' + '87654321'[rank(i)] + ' |'
        }

        /* empty piece */
        if (board[i] == null) {
          s += ' . '
        } else {
          var piece = board[i].type
          var color = board[i].color
          var symbol =
            color === WHITE ? piece.toUpperCase() : piece.toLowerCase()
          s += ' ' + symbol + ' '
        }

        if ((i + 1) & 0x88) {
          s += '|\n'
          i += 8
        }
      }
      s += '   +------------------------+\n'
      s += '     a  b  c  d  e  f  g  h'

      return s
    },

    remove: function (square) {
      return remove(square)
    },

    perft: function (depth) {
      return perft(depth)
    },

    square_color: function (square) {
      if (square in SQUARE_MAP) {
        var sq_0x88 = SQUARE_MAP[square]
        return (rank(sq_0x88) + file(sq_0x88)) % 2 === 0 ? 'light' : 'dark'
      }

      return null
    },

    history: function (options) {
      var reversed_history = []
      var move_history = []
      var verbose =
        typeof options !== 'undefined' &&
        'verbose' in options &&
        options.verbose

      while (history.length > 0) {
        reversed_history.push(undo_move())
      }

      while (reversed_history.length > 0) {
        var move = reversed_history.pop()
        if (verbose) {
          move_history.push(make_pretty(move))
        } else {
          move_history.push(move_to_san(move, generate_moves({ legal: true })))
        }
        make_move(move)
      }

      return move_history
    },
  }
}
</script>

<script>
(function () {
  'use strict';

  function escapeText(node, text) {
    node.textContent = text == null ? '' : String(text);
  }

  // --- Conversation panel: hydrate /transcript, subscribe /events, submit ---
  const chatLog = document.getElementById('chat-log');
  const chatForm = document.getElementById('chat-form');
  const chatInput = document.getElementById('chat-input');
  const liveDot = document.getElementById('live-dot');
  const liveLabel = document.getElementById('live-label');
  let chatStarted = false;

  function clearEmptyState() {
    if (!chatStarted) {
      chatStarted = true;
      chatLog.innerHTML = '';
    }
  }

  function appendChat(entry) {
    clearEmptyState();
    const row = document.createElement('div');
    row.className = 'chat-entry chat-' + (entry.role === 'learner' ? 'learner' : 'agent');
    const roleEl = document.createElement('span');
    roleEl.className = 'chat-role';
    escapeText(roleEl, entry.role);
    const textEl = document.createElement('span');
    escapeText(textEl, entry.text);
    row.appendChild(roleEl);
    row.appendChild(textEl);
    chatLog.appendChild(row);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  async function hydrateTranscript() {
    try {
      const res = await fetch('/transcript');
      const entries = await res.json();
      entries.forEach(appendChat);
    } catch (err) {
      console.error('Could not load transcript', err);
    }
  }

  function submitText(text) {
    return fetch('/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text }),
    }).catch(function (err) {
      console.error('Could not submit', err);
    });
  }

  function subscribeEvents(onState) {
    const source = new EventSource('/events');
    source.onopen = function () {
      liveDot.className = 'live-dot ok';
      liveLabel.textContent = 'live';
    };
    source.onerror = function () {
      liveDot.className = 'live-dot bad';
      liveLabel.textContent = 'reconnecting…';
    };
    source.onmessage = function (event) {
      let msg;
      try {
        msg = JSON.parse(event.data);
      } catch {
        return;
      }
      if (msg.kind === 'chat') {
        appendChat(msg);
      } else if (msg.kind === 'state' && typeof onState === 'function') {
        onState(msg.data);
      }
    };
  }

  chatForm.addEventListener('submit', function (event) {
    event.preventDefault();
    const text = chatInput.value.trim();
    if (!text) return;
    chatInput.value = '';
    submitText(text);
  });

  // --- Shell-specific: board rendering + click-to-move via vendored chess.js ---
  const titleEl = document.getElementById('b-title');
  const contextEl = document.getElementById('b-context');
  const promptEl = document.getElementById('b-prompt');
  const svg = document.getElementById('board-svg');
  const statusEl = document.getElementById('board-status');
  const promoPicker = document.getElementById('promotion-picker');

  const FILES = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
  const SIZE = 60; // px per square in the 480x480 viewBox
  const PIECE_GLYPHS = {
    wp: '♙', wn: '♘', wb: '♗', wr: '♖', wq: '♕', wk: '♔',
    bp: '♟', bn: '♞', bb: '♝', br: '♜', bq: '♛', bk: '♚',
  };

  let meta = { title: '', context: '', prompt: '', orientation: 'white' };
  let chess = Chess();
  let selected = null; // square name, e.g. 'e2'
  let legalDestinations = new Map(); // to-square -> array of verbose move objects (>1 = promotion choice)
  let pendingPromotion = null; // { from, to, choices }

  function squareToXY(square) {
    const fileIndex = FILES.indexOf(square[0]);
    const rankIndex = Number(square[1]);
    let col, row;
    if (meta.orientation === 'black') {
      col = 7 - fileIndex;
      row = rankIndex - 1;
    } else {
      col = fileIndex;
      row = 8 - rankIndex;
    }
    return { x: col * SIZE, y: row * SIZE };
  }

  function parseFenBoard(fen) {
    const placement = fen.split(' ')[0];
    const rows = placement.split('/');
    const board = {};
    rows.forEach(function (rowStr, i) {
      const rankNumber = 8 - i;
      let fileIndex = 0;
      for (const ch of rowStr) {
        if (/[1-8]/.test(ch)) {
          fileIndex += Number(ch);
        } else {
          const square = FILES[fileIndex] + rankNumber;
          board[square] = ch;
          fileIndex += 1;
        }
      }
    });
    return board;
  }

  function clearSelection() {
    selected = null;
    legalDestinations = new Map();
    pendingPromotion = null;
    promoPicker.hidden = true;
    promoPicker.innerHTML = '';
  }

  function updateStatus() {
    if (chess.in_checkmate()) {
      statusEl.textContent = 'Checkmate — ' + (chess.turn() === 'w' ? 'Black' : 'White') + ' wins.';
      statusEl.className = 'board-status warn';
    } else if (chess.in_stalemate()) {
      statusEl.textContent = 'Stalemate.';
      statusEl.className = 'board-status warn';
    } else if (chess.in_check()) {
      statusEl.textContent = (chess.turn() === 'w' ? 'White' : 'Black') + ' to move — in check.';
      statusEl.className = 'board-status warn';
    } else {
      statusEl.textContent = (chess.turn() === 'w' ? 'White' : 'Black') + ' to move.';
      statusEl.className = 'board-status';
    }
  }

  function renderBoard() {
    const svgNs = 'http://www.w3.org/2000/svg';
    svg.innerHTML = '';
    const board = parseFenBoard(chess.fen());

    FILES.forEach(function (file) {
      for (let rankNumber = 1; rankNumber <= 8; rankNumber++) {
        const square = file + rankNumber;
        const { x, y } = squareToXY(square);
        const isLight = (FILES.indexOf(file) + rankNumber) % 2 === 1;

        const rect = document.createElementNS(svgNs, 'rect');
        rect.setAttribute('x', x);
        rect.setAttribute('y', y);
        rect.setAttribute('width', SIZE);
        rect.setAttribute('height', SIZE);
        rect.setAttribute('class', 'square');
        rect.setAttribute('data-square', square);
        rect.setAttribute('fill', square === selected ? 'var(--sq-selected)' : (isLight ? 'var(--sq-light)' : 'var(--sq-dark)'));
        rect.addEventListener('click', function () { onSquareClick(square); });
        svg.appendChild(rect);

        const piece = board[square];
        if (piece) {
          // Vector pieces from the inlined <defs> (scripts/build-piece-defs.mjs).
          // Unicode glyphs render differently per installed font, and the
          // outline-style white glyphs washed out on light squares.
          const color = piece === piece.toUpperCase() ? 'w' : 'b';
          const inset = SIZE * 0.035;
          const ref = '#pc-' + color + piece.toUpperCase();
          const use = document.createElementNS(svgNs, 'use');
          use.setAttribute('href', ref);
          use.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', ref);
          use.setAttribute('x', x + inset);
          use.setAttribute('y', y + inset);
          use.setAttribute('width', SIZE - inset * 2);
          use.setAttribute('height', SIZE - inset * 2);
          use.setAttribute('class', 'piece');
          use.addEventListener('click', function () { onSquareClick(square); });
          svg.appendChild(use);
        }

        if (legalDestinations.has(square)) {
          const marker = document.createElementNS(svgNs, 'circle');
          marker.setAttribute('cx', x + SIZE / 2);
          marker.setAttribute('cy', y + SIZE / 2);
          // A destination is a capture if it's occupied (the common case) OR
          // any queued move to it captures without occupying it (en passant:
          // the captured pawn sits beside the destination, not on it, so the
          // pre-move board lookup alone would miss it).
          const isCapture = !!piece || legalDestinations.get(square).some(function (m) { return !!m.captured; });
          marker.setAttribute('r', isCapture ? SIZE * 0.42 : SIZE * 0.16);
          marker.setAttribute('fill', isCapture ? 'none' : 'var(--sq-legal)');
          marker.setAttribute('stroke', isCapture ? 'var(--sq-legal-capture)' : 'none');
          marker.setAttribute('stroke-width', isCapture ? '5' : '0');
          marker.style.pointerEvents = 'none';
          svg.appendChild(marker);
        }
      }
    });

    // Coordinate labels along the bottom (files) and left (ranks).
    FILES.forEach(function (file, i) {
      const col = meta.orientation === 'black' ? 7 - i : i;
      const label = document.createElementNS(svgNs, 'text');
      label.setAttribute('x', col * SIZE + SIZE - 6);
      label.setAttribute('y', 8 * SIZE - 4);
      label.setAttribute('font-size', '11');
      label.setAttribute('fill', 'var(--muted)');
      label.style.pointerEvents = 'none';
      label.textContent = file;
      svg.appendChild(label);
    });
    for (let rankNumber = 1; rankNumber <= 8; rankNumber++) {
      const row = meta.orientation === 'black' ? rankNumber - 1 : 8 - rankNumber;
      const label = document.createElementNS(svgNs, 'text');
      label.setAttribute('x', 3);
      label.setAttribute('y', row * SIZE + 13);
      label.setAttribute('font-size', '11');
      label.setAttribute('fill', 'var(--muted)');
      label.style.pointerEvents = 'none';
      label.textContent = rankNumber;
      svg.appendChild(label);
    }

    updateStatus();
  }

  function finalizeMove(from, to, promotion) {
    const result = chess.move({ from: from, to: to, promotion: promotion });
    clearSelection();
    if (!result) {
      // Should not happen: destinations offered are always computed as legal.
      renderBoard();
      return;
    }
    // Optimistic local re-render — do not wait for the server round-trip.
    renderBoard();
    submitText(result.san);
  }

  function showPromotionPicker(from, to, choices) {
    pendingPromotion = { from: from, to: to };
    promoPicker.innerHTML = '';
    promoPicker.hidden = false;
    const color = chess.turn();
    const order = ['q', 'r', 'b', 'n'];
    order.forEach(function (piece) {
      if (!choices.some(function (m) { return m.promotion === piece; })) return;
      const btn = document.createElement('button');
      btn.type = 'button';
      const pref = '#pc-' + color + piece.toUpperCase();
      btn.innerHTML = '<svg viewBox="0 0 100 100" width="30" height="30" aria-hidden="true" focusable="false">'
        + '<use href="' + pref + '" xlink:href="' + pref + '" width="100" height="100"></use></svg>';
      btn.addEventListener('click', function () {
        finalizeMove(from, to, piece);
      });
      promoPicker.appendChild(btn);
    });
  }

  function onSquareClick(square) {
    if (pendingPromotion) return; // must resolve promotion choice first

    if (selected && legalDestinations.has(square)) {
      const choices = legalDestinations.get(square);
      if (choices.length > 1) {
        showPromotionPicker(selected, square, choices);
      } else {
        finalizeMove(selected, square, choices[0].promotion);
      }
      return;
    }

    const piece = chess.get(square);
    if (selected === square) {
      clearSelection();
      renderBoard();
      return;
    }

    if (piece && piece.color === chess.turn()) {
      const verboseMoves = chess.moves({ square: square, verbose: true });
      if (verboseMoves.length === 0) {
        clearSelection();
        renderBoard();
        return;
      }
      selected = square;
      legalDestinations = new Map();
      verboseMoves.forEach(function (move) {
        if (!legalDestinations.has(move.to)) legalDestinations.set(move.to, []);
        legalDestinations.get(move.to).push(move);
      });
      renderBoard();
      return;
    }

    clearSelection();
    renderBoard();
  }

  function render() {
    document.title = 'Studio — ' + (meta.title || 'Board');
    escapeText(titleEl, meta.title || 'Board');
    escapeText(contextEl, meta.context || '');
    escapeText(promptEl, meta.prompt || '');
    renderBoard();
  }

  async function loadData() {
    try {
      const res = await fetch('/data');
      if (res.ok) {
        const data = await res.json();
        meta = Object.assign(meta, data);
      }
    } catch (err) {
      console.error('Could not load /data', err);
    }
    render();
  }

  async function loadInitialState() {
    try {
      const res = await fetch('/state');
      const state = await res.json();
      if (state && typeof state.fen === 'string' && state.fen) {
        chess.load(state.fen);
      }
    } catch (err) {
      console.error('Could not load /state', err);
    }
  }

  function onState(data) {
    // The agent confirms or corrects the authoritative position by pushing a
    // new FEN; any pending local selection is discarded since the position
    // under it may have changed.
    if (data && typeof data.fen === 'string' && data.fen) {
      chess.load(data.fen);
      clearSelection();
      renderBoard();
    }
  }

  hydrateTranscript();
  subscribeEvents(onState);
  loadData();
  loadInitialState().then(renderBoard);
})();
</script>
</body>
</html>
