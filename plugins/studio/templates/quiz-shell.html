<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Studio — Quiz</title>
<style>
  /*
   * quiz-shell: prompt -> response -> feedback. Data shape:
   *   {title, context, prompt, hints: string[]}
   * Generalizes the Al Bar layout (scenario paragraph, prompt heading, hint
   * chips) into a reusable template. This CSS/JS block is intentionally
   * duplicated across all four shells so each stays independently
   * self-contained (see plugins/studio/skills/studio/SKILL.md).
   */
  :root {
    --bg: #f6f6f4;
    --surface: #ffffff;
    --border: #e2e2de;
    --fg: #1b1b18;
    --muted: #66665f;
    --accent: #0f766e;
    --accent-fg: #ffffff;
    --chip-bg: #eef2f0;
    --chip-fg: #0f766e;
    --chip-border: #cfe3de;
    --danger: #b3261e;
    --live-ok: #1f9d55;
    --live-bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --surface: #1e2024;
      --border: #33353a;
      --fg: #ececea;
      --muted: #a3a39c;
      --accent: #4fd1c5;
      --accent-fg: #0b1f1c;
      --chip-bg: #223330;
      --chip-fg: #7ee8db;
      --chip-border: #2f4a44;
      --danger: #ff6b60;
      --live-ok: #3ddc84;
      --live-bad: #ff6b60;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .page { max-width: 1080px; margin: 0 auto; padding: 1.5rem; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
  h1 { font-size: 1.4rem; margin: 0; }
  .live { font-size: 0.75rem; color: var(--muted); display: flex; align-items: center; gap: 0.35rem; white-space: nowrap; }
  .live-dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--muted); display: inline-block; }
  .live-dot.ok { background: var(--live-ok); }
  .live-dot.bad { background: var(--live-bad); }
  .layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 1.25rem; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.1rem 1.25rem; }
  .context { color: var(--muted); margin: 0 0 1rem; }
  .prompt-card { margin-bottom: 1rem; }
  .prompt-card h2 { margin: 0; font-size: 1.15rem; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .chip {
    border: 1px solid var(--chip-border);
    background: var(--chip-bg);
    color: var(--chip-fg);
    border-radius: 999px;
    padding: 0.35rem 0.85rem;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .chip:hover { filter: brightness(1.05); }
  .hint-reveal { margin-top: 0.5rem; padding: 0.5rem 0.75rem; background: var(--chip-bg); border-radius: 0.5rem; font-size: 0.9rem; }
  .chat-panel { display: flex; flex-direction: column; height: 100%; min-height: 22rem; }
  .chat-heading { margin: 0 0 0.75rem; font-size: 1rem; font-weight: 600; }
  .chat-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; padding-right: 0.25rem; min-height: 14rem; max-height: 28rem; }
  .chat-entry { padding: 0.5rem 0.7rem; border-radius: 0.6rem; font-size: 0.92rem; max-width: 92%; }
  .chat-entry.chat-learner { align-self: flex-end; background: var(--accent); color: var(--accent-fg); }
  .chat-entry.chat-agent { align-self: flex-start; background: var(--chip-bg); color: var(--fg); }
  .chat-role { display: block; font-size: 0.7rem; opacity: 0.75; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 0.15rem; }
  .chat-form { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
  .chat-form input { flex: 1; padding: 0.55rem 0.7rem; border-radius: 0.5rem; border: 1px solid var(--border); background: var(--bg); color: var(--fg); font-size: 0.95rem; }
  .chat-form button { padding: 0.55rem 1rem; border-radius: 0.5rem; border: none; background: var(--accent); color: var(--accent-fg); font-weight: 600; cursor: pointer; }
  .chat-form button:hover { filter: brightness(1.05); }
  .empty-state { color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1 id="q-title">Loading…</h1>
    <span class="live"><span id="live-dot" class="live-dot"></span><span id="live-label">connecting…</span></span>
  </header>
  <main class="layout">
    <section class="card content">
      <p id="q-context" class="context"></p>
      <div class="prompt-card">
        <h2 id="q-prompt"></h2>
      </div>
      <div id="q-hints" class="chips" aria-live="polite"></div>
    </section>
    <aside class="card chat-panel">
      <h2 class="chat-heading">Conversation</h2>
      <div id="chat-log" class="chat-log"><p class="empty-state">No messages yet.</p></div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" type="text" placeholder="Type your response…" autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </aside>
  </main>
</div>
<script>
(function () {
  'use strict';

  function escapeText(node, text) {
    node.textContent = text == null ? '' : String(text);
  }

  // Minimal, injection-safe markdown: **bold** and _italic_ become real
  // elements via textContent, everything else is a plain text node — no
  // HTML is ever parsed from data, so untrusted content stays inert.
  function appendInline(el, text) {
    const raw = text == null ? '' : String(text);
    const pattern = /\*\*(.+?)\*\*|_(.+?)_/g;
    let lastIndex = 0;
    let match;
    while ((match = pattern.exec(raw)) !== null) {
      if (match.index > lastIndex) {
        el.appendChild(document.createTextNode(raw.slice(lastIndex, match.index)));
      }
      const strong = match[1];
      if (strong !== undefined) {
        const node = document.createElement('strong');
        node.textContent = strong;
        el.appendChild(node);
      } else {
        const node = document.createElement('em');
        node.textContent = match[2];
        el.appendChild(node);
      }
      lastIndex = pattern.lastIndex;
    }
    if (lastIndex < raw.length) {
      el.appendChild(document.createTextNode(raw.slice(lastIndex)));
    }
  }

  // --- Conversation panel: hydrate /transcript, subscribe /events, submit ---
  const chatLog = document.getElementById('chat-log');
  const chatForm = document.getElementById('chat-form');
  const chatInput = document.getElementById('chat-input');
  const liveDot = document.getElementById('live-dot');
  const liveLabel = document.getElementById('live-label');
  let chatStarted = false;

  function clearEmptyState() {
    if (!chatStarted) {
      chatStarted = true;
      chatLog.innerHTML = '';
    }
  }

  function appendChat(entry) {
    clearEmptyState();
    const row = document.createElement('div');
    row.className = 'chat-entry chat-' + (entry.role === 'learner' ? 'learner' : 'agent');
    const roleEl = document.createElement('span');
    roleEl.className = 'chat-role';
    escapeText(roleEl, entry.role);
    const textEl = document.createElement('span');
    escapeText(textEl, entry.text);
    row.appendChild(roleEl);
    row.appendChild(textEl);
    chatLog.appendChild(row);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  async function hydrateTranscript() {
    try {
      const res = await fetch('/transcript');
      const entries = await res.json();
      entries.forEach(appendChat);
    } catch (err) {
      console.error('Could not load transcript', err);
    }
  }

  function subscribeEvents(onState) {
    const source = new EventSource('/events');
    source.onopen = function () {
      liveDot.className = 'live-dot ok';
      liveLabel.textContent = 'live';
    };
    source.onerror = function () {
      liveDot.className = 'live-dot bad';
      liveLabel.textContent = 'reconnecting…';
    };
    source.onmessage = function (event) {
      let msg;
      try {
        msg = JSON.parse(event.data);
      } catch {
        return;
      }
      if (msg.kind === 'chat') {
        appendChat(msg);
      } else if (msg.kind === 'state' && typeof onState === 'function') {
        onState(msg.data);
      }
    };
  }

  chatForm.addEventListener('submit', function (event) {
    event.preventDefault();
    const text = chatInput.value.trim();
    if (!text) return;
    chatInput.value = '';
    fetch('/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text }),
    }).catch(function (err) {
      console.error('Could not submit', err);
    });
  });

  // --- Shell-specific: fetch /data, render, react to live state pushes ---
  const titleEl = document.getElementById('q-title');
  const contextEl = document.getElementById('q-context');
  const promptEl = document.getElementById('q-prompt');
  const hintsEl = document.getElementById('q-hints');

  let current = { title: '', context: '', prompt: '', hints: [] };

  function render() {
    document.title = 'Studio — ' + (current.title || 'Quiz');
    escapeText(titleEl, current.title || 'Quiz');
    contextEl.textContent = '';
    appendInline(contextEl, current.context || '');
    promptEl.textContent = '';
    appendInline(promptEl, current.prompt || '');
    hintsEl.innerHTML = '';
    const hints = Array.isArray(current.hints) ? current.hints : [];
    hints.forEach(function (hint, index) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.textContent = 'Hint ' + (index + 1);
      chip.addEventListener('click', function () {
        if (chip.nextElementSibling && chip.nextElementSibling.classList.contains('hint-reveal')) {
          chip.nextElementSibling.remove();
          return;
        }
        const reveal = document.createElement('div');
        reveal.className = 'hint-reveal';
        appendInline(reveal, hint);
        chip.insertAdjacentElement('afterend', reveal);
      });
      hintsEl.appendChild(chip);
    });
  }

  async function loadData() {
    try {
      const res = await fetch('/data');
      if (!res.ok) return;
      const data = await res.json();
      current = Object.assign(current, data);
      render();
    } catch (err) {
      console.error('Could not load /data', err);
    }
  }

  function onState(data) {
    // A live state push replaces whichever fields it carries (e.g. the next
    // prompt in the same exercise) without a full page reload.
    current = Object.assign({}, current, data || {});
    render();
  }

  hydrateTranscript();
  subscribeEvents(onState);
  loadData();
})();
</script>
</body>
</html>
