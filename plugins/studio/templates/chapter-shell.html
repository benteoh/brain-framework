<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Studio — Chapter</title>
<style>
  /*
   * chapter-shell: a long-form, self-paced interactive lesson document
   * (15-60 minutes of content), replacing the one-card-at-a-time drip model
   * (lesson-shell / quiz-shell). Zero agent latency during the lesson: all
   * feedback for anticipated answers is pre-authored in the /data payload
   * and revealed instantly client-side; every board is backed by a live
   * Stockfish WASM engine (loaded from /assets/*, see EngineManager below)
   * so the learner can explore unanticipated lines without waiting on the
   * agent. Data shape:
   *   { title, subtitle?, estimatedMinutes, provenance?, sections: [
   *       { id, heading, blocks: [ Block ] }
   *   ] }
   * Block union: prose | callout | board | game | exercise | compare | quiz
   * | recap — see the block renderers in the main script for the exact
   * shape of each. Every meaningful learner action POSTs a JSON-encoded
   * {kind:'chapter-event', event, section, block, payload} envelope to
   * /submit so the agent can debrief from structured evidence instead of
   * asking "how did it go?" (see docs/superpowers/specs/
   * 2026-08-16-chapter-mode-engine-coaching-design.md, sections 2, 5, 7).
   * Free-text questions typed into the ask-the-coach drawer go through as
   * plain text, NOT wrapped in that envelope.
   *
   * chess.js 0.13.4 is vendored below (see its own license block) for
   * legal-move generation/validation and lightweight PGN move replay —
   * same vendoring as board-shell.html. This CSS/JS block is intentionally
   * duplicated across shells so each stays independently self-contained
   * (see plugins/studio/skills/studio/SKILL.md).
   */
  :root {
    --bg: #f6f6f4;
    --surface: #ffffff;
    --surface-2: #fbfbfa;
    --border: #e2e2de;
    --fg: #1b1b18;
    --muted: #66665f;
    --accent: #0f766e;
    --accent-fg: #ffffff;
    --chip-bg: #eef2f0;
    --chip-fg: #0f766e;
    --chip-border: #cfe3de;
    --danger: #b3261e;
    --live-ok: #1f9d55;
    --live-bad: #b3261e;
    --sq-light: #ebecd0;
    --sq-dark: #739552;
    --sq-coord-on-light: #739552;
    --sq-coord-on-dark: #ebecd0;
    --sq-lastmove: rgba(255, 214, 0, 0.42);
    --verdict-right: #1f9d55;
    --verdict-wrong: #d13438;
    --sq-check: radial-gradient(circle, rgba(219,40,40,0.9) 0%, rgba(219,40,40,0.6) 45%, rgba(219,40,40,0) 72%);
    --sq-selected: #f2c94c;
    --sq-legal: rgba(15, 118, 110, 0.55);
    --sq-legal-capture: rgba(179, 38, 30, 0.55);
    --board-border: #33352f;
    --arrow: rgba(15, 118, 110, 0.85);
    --arrow-best: rgba(15, 118, 110, 0.9);
    --highlight: rgba(242, 201, 76, 0.55);

    --callout-principle-bg: #eef2f0;
    --callout-principle-border: #0f766e;
    --callout-theory-bg: #eef4fb;
    --callout-theory-border: #2563a6;
    --callout-warning-bg: #fbeeee;
    --callout-warning-border: #b3261e;
    --callout-insight-bg: #f6f0fb;
    --callout-insight-border: #7c3aed;

    --eval-white: #f6f6f4;
    --eval-black: #33352f;
    --eval-blunder: #b3261e;
    --eval-mistake: #c9852b;
    --eval-inaccuracy: #c9a92b;

    --shadow: 0 1px 2px rgba(20, 20, 15, 0.06), 0 4px 14px rgba(20, 20, 15, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --surface: #1e2024;
      --surface-2: #1a1c1f;
      --border: #33353a;
      --fg: #ececea;
      --muted: #a3a39c;
      --accent: #4fd1c5;
      --accent-fg: #0b1f1c;
      --chip-bg: #223330;
      --chip-fg: #7ee8db;
      --chip-border: #2f4a44;
      --danger: #ff6b60;
      --live-ok: #3ddc84;
      --live-bad: #ff6b60;
      --sq-light: #b3bd9a;
      --sq-dark: #55704a;
      --sq-coord-on-light: #55704a;
      --sq-coord-on-dark: #d8e0c4;
      --sq-lastmove: rgba(255, 214, 0, 0.30);
      --verdict-right: #2ea86a;
      --verdict-wrong: #e0524f;
      --sq-selected: #e0b23a;
      --sq-legal: rgba(79, 209, 197, 0.55);
      --sq-legal-capture: rgba(255, 107, 96, 0.55);
      --board-border: #0c0d0f;
      --arrow: rgba(79, 209, 197, 0.85);
      --arrow-best: rgba(79, 209, 197, 0.9);
      --highlight: rgba(224, 178, 58, 0.45);

      --callout-principle-bg: #182924;
      --callout-principle-border: #4fd1c5;
      --callout-theory-bg: #14202c;
      --callout-theory-border: #5b9bd9;
      --callout-warning-bg: #2b1a19;
      --callout-warning-border: #ff6b60;
      --callout-insight-bg: #221b2c;
      --callout-insight-border: #b794f6;

      --eval-white: #ececea;
      --eval-black: #0c0d0f;
      --eval-blunder: #ff6b60;
      --eval-mistake: #e0a94a;
      --eval-inaccuracy: #d8c65a;

      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
  }
  a { color: var(--accent); }
  button { font: inherit; }

  /* ---------- reading progress ---------- */
  .reading-progress {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: transparent;
    z-index: 60;
  }
  .reading-progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.08s linear;
  }

  /* ---------- header ---------- */
  .chapter-header {
    max-width: 78rem;
    margin: 0 auto;
    padding: 1.75rem 1.5rem 1.25rem;
  }
  .chapter-title { font-size: 1.75rem; margin: 0 0 0.3rem; font-weight: 700; letter-spacing: -0.01em; }
  .chapter-subtitle { margin: 0 0 0.65rem; color: var(--muted); font-size: 1.05rem; }
  .chapter-meta { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; font-size: 0.85rem; color: var(--muted); }
  .chapter-meta .pill {
    display: inline-flex; align-items: center; gap: 0.35rem;
    background: var(--chip-bg); color: var(--chip-fg);
    border: 1px solid var(--chip-border); border-radius: 999px;
    padding: 0.2rem 0.65rem; font-weight: 600; font-size: 0.78rem;
  }
  .chapter-provenance { margin-top: 0.6rem; font-size: 0.72rem; color: var(--muted); opacity: 0.85; }
  .chapter-provenance code { background: var(--chip-bg); border-radius: 0.3rem; padding: 0.05rem 0.3rem; font-size: 0.7rem; }

  /* ---------- layout: toc rail + content ---------- */
  .chapter-layout {
    max-width: 78rem;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
    display: grid;
    grid-template-columns: 15rem minmax(0, 1fr);
    gap: 2rem;
    align-items: start;
  }
  .toc {
    position: sticky;
    top: 1rem;
    max-height: calc(100vh - 2rem);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    padding: 0.25rem 0;
  }
  .toc-item {
    display: flex; align-items: center; gap: 0.5rem;
    text-align: left; background: none; border: none;
    border-left: 2px solid transparent;
    padding: 0.4rem 0.6rem;
    color: var(--muted);
    font-size: 0.85rem;
    cursor: pointer;
    border-radius: 0 0.4rem 0.4rem 0;
  }
  .toc-item:hover { background: var(--chip-bg); color: var(--fg); }
  .toc-item.active { color: var(--fg); border-left-color: var(--accent); background: var(--chip-bg); font-weight: 600; }
  .toc-status {
    flex-shrink: 0; width: 0.55rem; height: 0.55rem; border-radius: 50%;
    background: var(--border);
  }
  .toc-status.visited { background: var(--accent); }
  .toc-status.done { background: var(--live-ok); }
  .toc-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 900px) {
    .chapter-layout { grid-template-columns: 1fr; }
    .toc {
      position: sticky; top: 0; z-index: 40;
      flex-direction: row; overflow-x: auto; overflow-y: hidden;
      max-height: none; background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 0.25rem;
      gap: 0.35rem;
    }
    .toc-item { border-left: none; border-bottom: 2px solid transparent; white-space: nowrap; flex-shrink: 0; }
    .toc-item.active { border-left-color: transparent; border-bottom-color: var(--accent); }
  }

  .chapter-content { min-width: 0; }
  .section { padding: 1.25rem 0 2.25rem; border-bottom: 1px solid var(--border); scroll-margin-top: 1rem; }
  .section:last-child { border-bottom: none; }
  .section-heading { font-size: 1.35rem; font-weight: 700; margin: 0 0 1.1rem; }

  .block { position: relative; margin: 0 0 1.5rem; }
  .block:last-child { margin-bottom: 0; }
  .ask-about {
    position: absolute; top: 0; right: 0;
    font-size: 0.7rem; color: var(--muted);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 0.2rem 0.6rem; cursor: pointer;
    opacity: 0; transition: opacity 0.12s ease;
  }
  .block:hover .ask-about, .block:focus-within .ask-about, .ask-about:focus { opacity: 1; }
  .ask-about:hover { background: var(--chip-bg); color: var(--chip-fg); }

  /* ---------- prose ---------- */
  .prose { max-width: 68ch; font-size: 1.02rem; }
  .prose h2 { font-size: 1.2rem; margin: 1.4rem 0 0.6rem; }
  .prose h3 { font-size: 1.05rem; margin: 1.1rem 0 0.5rem; }
  .prose p { margin: 0 0 0.85rem; }
  .prose ul, .prose ol { margin: 0 0 0.85rem; padding-left: 1.4rem; }
  .prose li { margin-bottom: 0.3rem; }
  .prose code { background: var(--chip-bg); border-radius: 0.3rem; padding: 0.08rem 0.35rem; font-size: 0.9em; }
  .prose > *:first-child { margin-top: 0; }
  .prose > *:last-child { margin-bottom: 0; }

  /* ---------- callout ---------- */
  .callout { max-width: 68ch; border-radius: 0.6rem; padding: 1rem 1.15rem; border-left: 4px solid; }
  .callout-title { font-weight: 700; margin: 0 0 0.35rem; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .callout .prose { max-width: none; font-size: 0.98rem; }
  .callout-principle { background: var(--callout-principle-bg); border-color: var(--callout-principle-border); }
  .callout-principle .callout-title { color: var(--callout-principle-border); }
  .callout-theory { background: var(--callout-theory-bg); border-color: var(--callout-theory-border); }
  .callout-theory .callout-title { color: var(--callout-theory-border); }
  .callout-warning { background: var(--callout-warning-bg); border-color: var(--callout-warning-border); }
  .callout-warning .callout-title { color: var(--callout-warning-border); }
  .callout-insight { background: var(--callout-insight-bg); border-color: var(--callout-insight-border); }
  .callout-insight .callout-title { color: var(--callout-insight-border); }

  /* ---------- board card (shared by board / exercise / compare / game) ---------- */
  .board-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 0.8rem; padding: 1.1rem; box-shadow: var(--shadow);
    max-width: 40rem;
  }
  .board-card.wide { max-width: none; }
  .board-caption { font-size: 0.9rem; color: var(--muted); margin: 0.6rem 0 0; text-align: center; }
  .board-row { display: flex; gap: 0.75rem; align-items: flex-start; justify-content: center; }
  .board-holder { position: relative; width: 100%; max-width: 26rem; }
  .board-svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
  .board-svg rect.square { cursor: pointer; }
  .board-svg use.piece { cursor: pointer; }
  .board-svg.readonly rect.square, .board-svg.readonly use.piece { cursor: default; }
  .game-nav { display: flex; align-items: center; gap: 0.4rem; margin: 0.6rem 0 0.2rem; flex-wrap: wrap; }
  .game-nav-btn {
    min-width: 2.4rem; padding: 0.3rem 0.55rem; font-size: 0.9rem; line-height: 1;
    border: 1px solid var(--card-border); border-radius: 6px;
    background: var(--card-bg); color: var(--fg); cursor: pointer;
  }
  .game-nav-btn:hover:not(:disabled) { background: var(--chip-bg); }
  .game-nav-btn:disabled { opacity: 0.4; cursor: default; }
  .game-nav-counter { font-variant-numeric: tabular-nums; font-size: 0.85rem; color: var(--muted); margin-left: 0.2rem; }
  .game-nav-hint { font-size: 0.78rem; color: var(--muted); margin-left: auto; }
  .board-card:focus-visible { outline: 2px solid var(--chip-fg); outline-offset: 3px; }
  .board-svg text.coord {
    font-size: 14px;
    font-weight: 700;
    font-family: var(--font-sans, system-ui, sans-serif);
    pointer-events: none;
    user-select: none;
  }
  .board-status { font-size: 0.85rem; color: var(--muted); min-height: 1.2rem; text-align: center; margin-top: 0.5rem; }
  .board-status.warn { color: var(--danger); font-weight: 600; }
  .board-controls { display: flex; align-items: center; justify-content: center; gap: 0.6rem; margin-top: 0.6rem; flex-wrap: wrap; }
  .board-btn {
    border: 1px solid var(--chip-border); background: var(--chip-bg); color: var(--chip-fg);
    border-radius: 0.5rem; padding: 0.35rem 0.7rem; font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
  .board-btn:hover:not(:disabled) { filter: brightness(1.06); }
  .board-btn:disabled { opacity: 0.4; cursor: default; }
  .promotion-picker { display: flex; gap: 0.5rem; justify-content: center; margin-top: 0.5rem; }
  .promotion-picker button { font-size: 1.3rem; padding: 0.25rem 0.55rem; border-radius: 0.5rem; border: 1px solid var(--chip-border); background: var(--chip-bg); color: var(--chip-fg); cursor: pointer; }

  /* ---------- eval bar ---------- */
  .eval-bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; width: 1.6rem; flex-shrink: 0; }
  .eval-bar { width: 1.1rem; height: 100%; min-height: 12rem; border-radius: 0.3rem; overflow: hidden; border: 1px solid var(--board-border); display: flex; flex-direction: column-reverse; background: var(--eval-black); }
  .eval-bar-fill { width: 100%; background: var(--eval-white); height: 50%; transition: height 0.25s ease; }
  .eval-bar.thinking .eval-bar-fill { opacity: 0.55; }
  .eval-label { font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .eval-hidden-note { font-size: 0.78rem; color: var(--muted); text-align: center; margin-top: 0.5rem; font-style: italic; }
  .top-lines { margin-top: 0.6rem; }
  .top-lines summary { cursor: pointer; font-size: 0.8rem; color: var(--muted); }
  .top-lines ol { margin: 0.4rem 0 0; padding-left: 1.3rem; font-size: 0.82rem; }
  .top-lines li { margin-bottom: 0.25rem; font-variant-numeric: tabular-nums; }
  .top-lines .pv-eval { font-weight: 700; margin-right: 0.4rem; }

  /* ---------- variation / move list ---------- */
  .move-list { display: flex; flex-wrap: wrap; gap: 0.2rem 0.35rem; font-size: 0.85rem; margin-top: 0.7rem; max-height: 8.5rem; overflow-y: auto; }
  .move-pair { display: inline-flex; gap: 0.3rem; align-items: baseline; }
  .move-num { color: var(--muted); font-size: 0.78rem; }
  .move-chip { border: none; background: none; color: var(--fg); cursor: pointer; padding: 0.05rem 0.3rem; border-radius: 0.3rem; }
  .move-chip:hover { background: var(--chip-bg); }
  .move-chip.current { background: var(--accent); color: var(--accent-fg); font-weight: 700; }
  .move-chip.blunder { color: var(--eval-blunder); }
  .move-chip.mistake { color: var(--eval-mistake); }
  .move-chip.inaccuracy { color: var(--eval-inaccuracy); }
  .annotation-note { margin-top: 0.6rem; padding: 0.55rem 0.7rem; background: var(--chip-bg); border-radius: 0.5rem; font-size: 0.85rem; }

  /* ---------- game eval graph ---------- */
  .eval-graph-wrap { margin-top: 0.75rem; }
  .eval-graph { width: 100%; height: 5.5rem; display: block; cursor: pointer; }
  .eval-graph .midline { stroke: var(--border); stroke-width: 1; }
  .eval-graph .area-white { fill: var(--eval-white); opacity: 0.35; }
  .eval-graph .area-black { fill: var(--eval-black); opacity: 0.35; }
  .eval-graph .cursor-line { stroke: var(--accent); stroke-width: 1.5; }

  /* ---------- exercise ---------- */
  .exercise-question { font-weight: 600; margin: 0 0 0.75rem; font-size: 1.02rem; max-width: 68ch; }
  .exercise-options { display: flex; flex-direction: column; gap: 0.5rem; max-width: 30rem; }
  .exercise-option {
    text-align: left; border: 1px solid var(--border); background: var(--surface);
    border-radius: 0.5rem; padding: 0.55rem 0.8rem; cursor: pointer; font-size: 0.95rem;
  }
  .exercise-option:hover { border-color: var(--chip-border); background: var(--chip-bg); }
  .exercise-option.correct { border-color: var(--live-ok); background: var(--callout-principle-bg); }
  .exercise-option.incorrect { border-color: var(--danger); background: var(--callout-warning-bg); }
  .exercise-text-form { display: flex; gap: 0.5rem; max-width: 30rem; }
  .exercise-text-form input {
    flex: 1; padding: 0.5rem 0.7rem; border-radius: 0.5rem; border: 1px solid var(--border);
    background: var(--surface); color: var(--fg); font-size: 0.95rem;
  }
  .exercise-text-form button, .quiz-retry, .hint-btn {
    padding: 0.5rem 0.9rem; border-radius: 0.5rem; border: none; background: var(--accent);
    color: var(--accent-fg); font-weight: 600; cursor: pointer; font-size: 0.88rem;
  }
  .exercise-text-form button:hover, .quiz-retry:hover, .hint-btn:hover { filter: brightness(1.05); }
  .hint-btn:disabled { opacity: 0.4; cursor: default; }
  .hint-ladder { margin-top: 0.7rem; display: flex; flex-direction: column; gap: 0.4rem; align-items: flex-start; }
  .hint-item { background: var(--chip-bg); border: 1px solid var(--chip-border); border-radius: 0.5rem; padding: 0.5rem 0.7rem; font-size: 0.88rem; max-width: 68ch; }
  .exercise-feedback { margin-top: 0.85rem; padding: 0.7rem 0.9rem; border-radius: 0.5rem; font-size: 0.92rem; max-width: 68ch; }
  .exercise-feedback.correct { background: var(--callout-principle-bg); border: 1px solid var(--callout-principle-border); }
  .exercise-feedback.incorrect { background: var(--callout-warning-bg); border: 1px solid var(--callout-warning-border); }
  .exercise-feedback.fallback { background: var(--callout-theory-bg); border: 1px solid var(--callout-theory-border); }
  .exercise-explanation { margin-top: 0.7rem; padding: 0.7rem 0.9rem; border-radius: 0.5rem; background: var(--surface-2); border: 1px solid var(--border); font-size: 0.92rem; max-width: 68ch; }
  .exercise-engine-fallback { margin-top: 0.6rem; font-size: 0.85rem; color: var(--muted); }
  .attempt-note { font-size: 0.78rem; color: var(--muted); margin-top: 0.4rem; }

  /* ---------- compare ---------- */
  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
  @media (max-width: 720px) { .compare-grid { grid-template-columns: 1fr; } }
  .compare-label { font-weight: 700; font-size: 0.9rem; margin-bottom: 0.4rem; text-align: center; }
  .compare-eval { text-align: center; font-size: 0.85rem; color: var(--muted); margin-top: 0.4rem; font-variant-numeric: tabular-nums; }
  .compare-note { margin-top: 1rem; padding: 0.7rem 0.9rem; background: var(--chip-bg); border-radius: 0.5rem; font-size: 0.92rem; max-width: 68ch; }

  /* ---------- quiz ---------- */
  .quiz-question { font-weight: 600; margin: 0 0 0.75rem; font-size: 1.02rem; max-width: 68ch; }
  .quiz-options { display: flex; flex-direction: column; gap: 0.5rem; max-width: 40rem; }
  .quiz-option-feedback { margin-top: 0.4rem; font-size: 0.85rem; padding: 0.5rem 0.7rem; border-radius: 0.4rem; background: var(--surface-2); }
  .quiz-actions { margin-top: 0.75rem; }

  /* ---------- recap ---------- */
  .recap-list { max-width: 68ch; padding-left: 1.4rem; margin: 0; }
  .recap-list li { margin-bottom: 0.5rem; }

  /* ---------- ask-the-coach drawer ---------- */
  .coach-toggle {
    position: fixed; right: 1.25rem; bottom: 1.25rem; z-index: 70;
    background: var(--accent); color: var(--accent-fg); border: none;
    border-radius: 999px; padding: 0.7rem 1.1rem; font-weight: 700; font-size: 0.9rem;
    cursor: pointer; box-shadow: var(--shadow); display: flex; align-items: center; gap: 0.4rem;
  }
  .coach-toggle:hover { filter: brightness(1.05); }
  .coach-toggle .badge { background: var(--accent-fg); color: var(--accent); border-radius: 999px; font-size: 0.7rem; padding: 0.05rem 0.4rem; }
  .coach-drawer {
    position: fixed; right: 1rem; bottom: 1rem; z-index: 80;
    width: min(24rem, calc(100vw - 2rem)); max-height: min(32rem, calc(100vh - 2rem));
    background: var(--surface); border: 1px solid var(--border); border-radius: 0.9rem;
    box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden;
  }
  .coach-drawer[hidden] { display: none; }
  .coach-head { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 0.9rem; border-bottom: 1px solid var(--border); }
  .coach-head h2 { margin: 0; font-size: 0.98rem; }
  .coach-close { background: none; border: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; line-height: 1; padding: 0.2rem; }
  .coach-close:hover { color: var(--fg); }
  .chat-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; padding: 0.75rem 0.9rem; min-height: 8rem; }
  .chat-entry { padding: 0.5rem 0.7rem; border-radius: 0.6rem; font-size: 0.88rem; max-width: 92%; }
  .chat-entry.chat-learner { align-self: flex-end; background: var(--accent); color: var(--accent-fg); }
  .chat-entry.chat-agent { align-self: flex-start; background: var(--chip-bg); color: var(--fg); }
  .chat-role { display: block; font-size: 0.68rem; opacity: 0.75; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 0.15rem; }
  .chat-form { display: flex; gap: 0.5rem; padding: 0.75rem 0.9rem; border-top: 1px solid var(--border); }
  .chat-form input { flex: 1; padding: 0.5rem 0.65rem; border-radius: 0.5rem; border: 1px solid var(--border); background: var(--bg); color: var(--fg); font-size: 0.9rem; }
  .chat-form button { padding: 0.5rem 0.9rem; border-radius: 0.5rem; border: none; background: var(--accent); color: var(--accent-fg); font-weight: 600; cursor: pointer; }
  .chat-form button:hover { filter: brightness(1.05); }
  .empty-state { color: var(--muted); font-size: 0.88rem; }
  .live-note { font-size: 0.7rem; color: var(--muted); display: flex; align-items: center; gap: 0.3rem; padding: 0 0.9rem 0.5rem; }
  .live-dot { width: 0.45rem; height: 0.45rem; border-radius: 50%; background: var(--muted); display: inline-block; }
  .live-dot.ok { background: var(--live-ok); }
  .live-dot.bad { background: var(--live-bad); }

  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- print ---------- */
  @media print {
    .reading-progress, .toc, .coach-toggle, .coach-drawer, .ask-about,
    .board-controls, .promotion-picker, .top-lines, .eval-bar-wrap,
    .exercise-text-form, .hint-btn, .quiz-retry { display: none !important; }
    .chapter-layout { grid-template-columns: 1fr; display: block; }
    body { background: #fff; color: #000; }
    .board-card { box-shadow: none; border: 1px solid #999; break-inside: avoid; }
    .section { break-inside: avoid-page; border-bottom: none; }
    a { color: #000; text-decoration: underline; }
  }
</style>

const PARSER_STRICT = 0

/* this function is used to uniquely identify ambiguous moves */
function get_disambiguator(move, moves) {
  var from = move.from
  var to = move.to
  var piece = move.piece

  var ambiguities = 0
  var same_rank = 0
  var same_file = 0

  for (var i = 0, len = moves.length; i < len; i++) {
    var ambig_from = moves[i].from
    var ambig_to = moves[i].to
    var ambig_piece = moves[i].piece

    /* if a move of the same piece type ends on the same to square, we'll
     * need to add a disambiguator to the algebraic notation
     */
    if (piece === ambig_piece && from !== ambig_from && to === ambig_to) {
      ambiguities++

      if (rank(from) === rank(ambig_from)) {
        same_rank++
      }

      if (file(from) === file(ambig_from)) {
        same_file++
      }
    }
  }

  if (ambiguities > 0) {
    /* if there exists a similar moving piece on the same rank and file as
     * the move in question, use the square as the disambiguator
     */
    if (same_rank > 0 && same_file > 0) {
      return algebraic(from)
    } else if (same_file > 0) {
      /* if the moving piece rests on the same file, use the rank symbol as the
       * disambiguator
       */
      return algebraic(from).charAt(1)
    } else {
      /* else use the file symbol */
      return algebraic(from).charAt(0)
    }
  }

  return ''
}

function infer_piece_type(san) {
  var piece_type = san.charAt(0)
  if (piece_type >= 'a' && piece_type <= 'h') {
    var matches = san.match(/[a-h]\d.*[a-h]\d/)
    if (matches) {
      return undefined
    }
    return PAWN
  }
  piece_type = piece_type.toLowerCase()
  if (piece_type === 'o') {
    return KING
  }
  return piece_type
}

// parses all of the decorators out of a SAN string
function stripped_san(move) {
  return move.replace(/=/, '').replace(/[+#]?[?!]*$/, '')
}

/*****************************************************************************
 * UTILITY FUNCTIONS
 ****************************************************************************/
function rank(i) {
  return i >> 4
}

function file(i) {
  return i & 15
}

function algebraic(i) {
  var f = file(i),
    r = rank(i)
  return 'abcdefgh'.substring(f, f + 1) + '87654321'.substring(r, r + 1)
}

function swap_color(c) {
  return c === WHITE ? BLACK : WHITE
}

function is_digit(c) {
  return '0123456789'.indexOf(c) !== -1
}

function clone(obj) {
  var dupe = obj instanceof Array ? [] : {}

  for (var property in obj) {
    if (typeof property === 'object') {
      dupe[property] = clone(obj[property])
    } else {
      dupe[property] = obj[property]
    }
  }

  return dupe
}

function trim(str) {
  return str.replace(/^\s+|\s+$/g, '')
}

const BLACK = 'b'
const WHITE = 'w'

const EMPTY = -1

const PAWN = 'p'
const KNIGHT = 'n'
const BISHOP = 'b'
const ROOK = 'r'
const QUEEN = 'q'
const KING = 'k'

const SQUARES = (function () {
  /* from the ECMA-262 spec (section 12.6.4):
   * "The mechanics of enumerating the properties ... is
   * implementation dependent"
   * so: for (var sq in SQUARES) { keys.push(sq); } might not be
   * ordered correctly
   */
  var keys = []
  for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
    if (i & 0x88) {
      i += 7
      continue
    }
    keys.push(algebraic(i))
  }
  return keys
})()

const FLAGS = {
  NORMAL: 'n',
  CAPTURE: 'c',
  BIG_PAWN: 'b',
  EP_CAPTURE: 'e',
  PROMOTION: 'p',
  KSIDE_CASTLE: 'k',
  QSIDE_CASTLE: 'q',
}

const Chess = function (fen) {
  var board = new Array(128)
  var kings = { w: EMPTY, b: EMPTY }
  var turn = WHITE
  var castling = { w: 0, b: 0 }
  var ep_square = EMPTY
  var half_moves = 0
  var move_number = 1
  var history = []
  var header = {}
  var comments = {}

  /* if the user passes in a fen string, load it, else default to
   * starting position
   */
  if (typeof fen === 'undefined') {
    load(DEFAULT_POSITION)
  } else {
    load(fen)
  }

  function clear(keep_headers) {
    if (typeof keep_headers === 'undefined') {
      keep_headers = false
    }

    board = new Array(128)
    kings = { w: EMPTY, b: EMPTY }
    turn = WHITE
    castling = { w: 0, b: 0 }
    ep_square = EMPTY
    half_moves = 0
    move_number = 1
    history = []
    if (!keep_headers) header = {}
    comments = {}
    update_setup(generate_fen())
  }

  function prune_comments() {
    var reversed_history = []
    var current_comments = {}
    var copy_comment = function (fen) {
      if (fen in comments) {
        current_comments[fen] = comments[fen]
      }
    }
    while (history.length > 0) {
      reversed_history.push(undo_move())
    }
    copy_comment(generate_fen())
    while (reversed_history.length > 0) {
      make_move(reversed_history.pop())
      copy_comment(generate_fen())
    }
    comments = current_comments
  }

  function reset() {
    load(DEFAULT_POSITION)
  }

  function load(fen, keep_headers) {
    if (typeof keep_headers === 'undefined') {
      keep_headers = false
    }

    var tokens = fen.split(/\s+/)
    var position = tokens[0]
    var square = 0

    if (!validate_fen(fen).valid) {
      return false
    }

    clear(keep_headers)

    for (var i = 0; i < position.length; i++) {
      var piece = position.charAt(i)

      if (piece === '/') {
        square += 8
      } else if (is_digit(piece)) {
        square += parseInt(piece, 10)
      } else {
        var color = piece < 'a' ? WHITE : BLACK
        put({ type: piece.toLowerCase(), color: color }, algebraic(square))
        square++
      }
    }

    turn = tokens[1]

    if (tokens[2].indexOf('K') > -1) {
      castling.w |= BITS.KSIDE_CASTLE
    }
    if (tokens[2].indexOf('Q') > -1) {
      castling.w |= BITS.QSIDE_CASTLE
    }
    if (tokens[2].indexOf('k') > -1) {
      castling.b |= BITS.KSIDE_CASTLE
    }
    if (tokens[2].indexOf('q') > -1) {
      castling.b |= BITS.QSIDE_CASTLE
    }

    ep_square = tokens[3] === '-' ? EMPTY : SQUARE_MAP[tokens[3]]
    half_moves = parseInt(tokens[4], 10)
    move_number = parseInt(tokens[5], 10)

    update_setup(generate_fen())

    return true
  }

  /* TODO: this function is pretty much crap - it validates structure but
   * completely ignores content (e.g. doesn't verify that each side has a king)
   * ... we should rewrite this, and ditch the silly error_number field while
   * we're at it
   */
  function validate_fen(fen) {
    var errors = {
      0: 'No errors.',
      1: 'FEN string must contain six space-delimited fields.',
      2: '6th field (move number) must be a positive integer.',
      3: '5th field (half move counter) must be a non-negative integer.',
      4: '4th field (en-passant square) is invalid.',
      5: '3rd field (castling availability) is invalid.',
      6: '2nd field (side to move) is invalid.',
      7: "1st field (piece positions) does not contain 8 '/'-delimited rows.",
      8: '1st field (piece positions) is invalid [consecutive numbers].',
      9: '1st field (piece positions) is invalid [invalid piece].',
      10: '1st field (piece positions) is invalid [row too large].',
      11: 'Illegal en-passant square',
    }

    /* 1st criterion: 6 space-seperated fields? */
    var tokens = fen.split(/\s+/)
    if (tokens.length !== 6) {
      return { valid: false, error_number: 1, error: errors[1] }
    }

    /* 2nd criterion: move number field is a integer value > 0? */
    if (isNaN(parseInt(tokens[5])) || parseInt(tokens[5], 10) <= 0) {
      return { valid: false, error_number: 2, error: errors[2] }
    }

    /* 3rd criterion: half move counter is an integer >= 0? */
    if (isNaN(parseInt(tokens[4])) || parseInt(tokens[4], 10) < 0) {
      return { valid: false, error_number: 3, error: errors[3] }
    }

    /* 4th criterion: 4th field is a valid e.p.-string? */
    if (!/^(-|[abcdefgh][36])$/.test(tokens[3])) {
      return { valid: false, error_number: 4, error: errors[4] }
    }

    /* 5th criterion: 3th field is a valid castle-string? */
    if (!/^(KQ?k?q?|Qk?q?|kq?|q|-)$/.test(tokens[2])) {
      return { valid: false, error_number: 5, error: errors[5] }
    }

    /* 6th criterion: 2nd field is "w" (white) or "b" (black)? */
    if (!/^(w|b)$/.test(tokens[1])) {
      return { valid: false, error_number: 6, error: errors[6] }
    }

    /* 7th criterion: 1st field contains 8 rows? */
    var rows = tokens[0].split('/')
    if (rows.length !== 8) {
      return { valid: false, error_number: 7, error: errors[7] }
    }

    /* 8th criterion: every row is valid? */
    for (var i = 0; i < rows.length; i++) {
      /* check for right sum of fields AND not two numbers in succession */
      var sum_fields = 0
      var previous_was_number = false

      for (var k = 0; k < rows[i].length; k++) {
        if (!isNaN(rows[i][k])) {
          if (previous_was_number) {
            return { valid: false, error_number: 8, error: errors[8] }
          }
          sum_fields += parseInt(rows[i][k], 10)
          previous_was_number = true
        } else {
          if (!/^[prnbqkPRNBQK]$/.test(rows[i][k])) {
            return { valid: false, error_number: 9, error: errors[9] }
          }
          sum_fields += 1
          previous_was_number = false
        }
      }
      if (sum_fields !== 8) {
        return { valid: false, error_number: 10, error: errors[10] }
      }
    }

    if (
      (tokens[3][1] == '3' && tokens[1] == 'w') ||
      (tokens[3][1] == '6' && tokens[1] == 'b')
    ) {
      return { valid: false, error_number: 11, error: errors[11] }
    }

    /* everything's okay! */
    return { valid: true, error_number: 0, error: errors[0] }
  }

  function generate_fen() {
    var empty = 0
    var fen = ''

    for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
      if (board[i] == null) {
        empty++
      } else {
        if (empty > 0) {
          fen += empty
          empty = 0
        }
        var color = board[i].color
        var piece = board[i].type

        fen += color === WHITE ? piece.toUpperCase() : piece.toLowerCase()
      }

      if ((i + 1) & 0x88) {
        if (empty > 0) {
          fen += empty
        }

        if (i !== SQUARE_MAP.h1) {
          fen += '/'
        }

        empty = 0
        i += 8
      }
    }

    var cflags = ''
    if (castling[WHITE] & BITS.KSIDE_CASTLE) {
      cflags += 'K'
    }
    if (castling[WHITE] & BITS.QSIDE_CASTLE) {
      cflags += 'Q'
    }
    if (castling[BLACK] & BITS.KSIDE_CASTLE) {
      cflags += 'k'
    }
    if (castling[BLACK] & BITS.QSIDE_CASTLE) {
      cflags += 'q'
    }

    /* do we have an empty castling flag? */
    cflags = cflags || '-'
    var epflags = ep_square === EMPTY ? '-' : algebraic(ep_square)

    return [fen, turn, cflags, epflags, half_moves, move_number].join(' ')
  }

  function set_header(args) {
    for (var i = 0; i < args.length; i += 2) {
      if (typeof args[i] === 'string' && typeof args[i + 1] === 'string') {
        header[args[i]] = args[i + 1]
      }
    }
    return header
  }

  /* called when the initial board setup is changed with put() or remove().
   * modifies the SetUp and FEN properties of the header object.  if the FEN is
   * equal to the default position, the SetUp and FEN are deleted
   * the setup is only updated if history.length is zero, ie moves haven't been
   * made.
   */
  function update_setup(fen) {
    if (history.length > 0) return

    if (fen !== DEFAULT_POSITION) {
      header['SetUp'] = '1'
      header['FEN'] = fen
    } else {
      delete header['SetUp']
      delete header['FEN']
    }
  }

  function get(square) {
    var piece = board[SQUARE_MAP[square]]
    return piece ? { type: piece.type, color: piece.color } : null
  }

  function put(piece, square) {
    /* check for valid piece object */
    if (!('type' in piece && 'color' in piece)) {
      return false
    }

    /* check for piece */
    if (SYMBOLS.indexOf(piece.type.toLowerCase()) === -1) {
      return false
    }

    /* check for valid square */
    if (!(square in SQUARE_MAP)) {
      return false
    }

    var sq = SQUARE_MAP[square]

    /* don't let the user place more than one king */
    if (
      piece.type == KING &&
      !(kings[piece.color] == EMPTY || kings[piece.color] == sq)
    ) {
      return false
    }

    board[sq] = { type: piece.type, color: piece.color }
    if (piece.type === KING) {
      kings[piece.color] = sq
    }

    update_setup(generate_fen())

    return true
  }

  function remove(square) {
    var piece = get(square)
    board[SQUARE_MAP[square]] = null
    if (piece && piece.type === KING) {
      kings[piece.color] = EMPTY
    }

    update_setup(generate_fen())

    return piece
  }

  function build_move(board, from, to, flags, promotion) {
    var move = {
      color: turn,
      from: from,
      to: to,
      flags: flags,
      piece: board[from].type,
    }

    if (promotion) {
      move.flags |= BITS.PROMOTION
      move.promotion = promotion
    }

    if (board[to]) {
      move.captured = board[to].type
    } else if (flags & BITS.EP_CAPTURE) {
      move.captured = PAWN
    }
    return move
  }

  function generate_moves(options) {
    function add_move(board, moves, from, to, flags) {
      /* if pawn promotion */
      if (
        board[from].type === PAWN &&
        (rank(to) === RANK_8 || rank(to) === RANK_1)
      ) {
        var pieces = [QUEEN, ROOK, BISHOP, KNIGHT]
        for (var i = 0, len = pieces.length; i < len; i++) {
          moves.push(build_move(board, from, to, flags, pieces[i]))
        }
      } else {
        moves.push(build_move(board, from, to, flags))
      }
    }

    var moves = []
    var us = turn
    var them = swap_color(us)
    var second_rank = { b: RANK_7, w: RANK_2 }

    var first_sq = SQUARE_MAP.a8
    var last_sq = SQUARE_MAP.h1
    var single_square = false

    /* do we want legal moves? */
    var legal =
      typeof options !== 'undefined' && 'legal' in options
        ? options.legal
        : true

    var piece_type =
      typeof options !== 'undefined' &&
      'piece' in options &&
      typeof options.piece === 'string'
        ? options.piece.toLowerCase()
        : true

    /* are we generating moves for a single square? */
    if (typeof options !== 'undefined' && 'square' in options) {
      if (options.square in SQUARE_MAP) {
        first_sq = last_sq = SQUARE_MAP[options.square]
        single_square = true
      } else {
        /* invalid square */
        return []
      }
    }

    for (var i = first_sq; i <= last_sq; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece == null || piece.color !== us) {
        continue
      }

      if (piece.type === PAWN && (piece_type === true || piece_type === PAWN)) {
        /* single square, non-capturing */
        var square = i + PAWN_OFFSETS[us][0]
        if (board[square] == null) {
          add_move(board, moves, i, square, BITS.NORMAL)

          /* double square */
          var square = i + PAWN_OFFSETS[us][1]
          if (second_rank[us] === rank(i) && board[square] == null) {
            add_move(board, moves, i, square, BITS.BIG_PAWN)
          }
        }

        /* pawn captures */
        for (j = 2; j < 4; j++) {
          var square = i + PAWN_OFFSETS[us][j]
          if (square & 0x88) continue

          if (board[square] != null && board[square].color === them) {
            add_move(board, moves, i, square, BITS.CAPTURE)
          } else if (square === ep_square) {
            add_move(board, moves, i, ep_square, BITS.EP_CAPTURE)
          }
        }
      } else if (piece_type === true || piece_type === piece.type) {
        for (var j = 0, len = PIECE_OFFSETS[piece.type].length; j < len; j++) {
          var offset = PIECE_OFFSETS[piece.type][j]
          var square = i

          while (true) {
            square += offset
            if (square & 0x88) break

            if (board[square] == null) {
              add_move(board, moves, i, square, BITS.NORMAL)
            } else {
              if (board[square].color === us) break
              add_move(board, moves, i, square, BITS.CAPTURE)
              break
            }

            /* break, if knight or king */
            if (piece.type === 'n' || piece.type === 'k') break
          }
        }
      }
    }

    /* check for castling if: a) we're generating all moves, or b) we're doing
     * single square move generation on the king's square
     */
    if (piece_type === true || piece_type === KING) {
      if (!single_square || last_sq === kings[us]) {
        /* king-side castling */
        if (castling[us] & BITS.KSIDE_CASTLE) {
          var castling_from = kings[us]
          var castling_to = castling_from + 2

          if (
            board[castling_from + 1] == null &&
            board[castling_to] == null &&
            !attacked(them, kings[us]) &&
            !attacked(them, castling_from + 1) &&
            !attacked(them, castling_to)
          ) {
            add_move(board, moves, kings[us], castling_to, BITS.KSIDE_CASTLE)
          }
        }

        /* queen-side castling */
        if (castling[us] & BITS.QSIDE_CASTLE) {
          var castling_from = kings[us]
          var castling_to = castling_from - 2

          if (
            board[castling_from - 1] == null &&
            board[castling_from - 2] == null &&
            board[castling_from - 3] == null &&
            !attacked(them, kings[us]) &&
            !attacked(them, castling_from - 1) &&
            !attacked(them, castling_to)
          ) {
            add_move(board, moves, kings[us], castling_to, BITS.QSIDE_CASTLE)
          }
        }
      }
    }

    /* return all pseudo-legal moves (this includes moves that allow the king
     * to be captured)
     */
    if (!legal) {
      return moves
    }

    /* filter out illegal moves */
    var legal_moves = []
    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(us)) {
        legal_moves.push(moves[i])
      }
      undo_move()
    }

    return legal_moves
  }

  /* convert a move from 0x88 coordinates to Standard Algebraic Notation
   * (SAN)
   *
   * @param {boolean} sloppy Use the sloppy SAN generator to work around over
   * disambiguation bugs in Fritz and Chessbase.  See below:
   *
   * r1bqkbnr/ppp2ppp/2n5/1B1pP3/4P3/8/PPPP2PP/RNBQK1NR b KQkq - 2 4
   * 4. ... Nge7 is overly disambiguated because the knight on c6 is pinned
   * 4. ... Ne7 is technically the valid SAN
   */
  function move_to_san(move, moves) {
    var output = ''

    if (move.flags & BITS.KSIDE_CASTLE) {
      output = 'O-O'
    } else if (move.flags & BITS.QSIDE_CASTLE) {
      output = 'O-O-O'
    } else {
      if (move.piece !== PAWN) {
        var disambiguator = get_disambiguator(move, moves)
        output += move.piece.toUpperCase() + disambiguator
      }

      if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
        if (move.piece === PAWN) {
          output += algebraic(move.from)[0]
        }
        output += 'x'
      }

      output += algebraic(move.to)

      if (move.flags & BITS.PROMOTION) {
        output += '=' + move.promotion.toUpperCase()
      }
    }

    make_move(move)
    if (in_check()) {
      if (in_checkmate()) {
        output += '#'
      } else {
        output += '+'
      }
    }
    undo_move()

    return output
  }

  function attacked(color, square) {
    for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      /* if empty square or wrong color */
      if (board[i] == null || board[i].color !== color) continue

      var piece = board[i]
      var difference = i - square
      var index = difference + 119

      if (ATTACKS[index] & (1 << SHIFTS[piece.type])) {
        if (piece.type === PAWN) {
          if (difference > 0) {
            if (piece.color === WHITE) return true
          } else {
            if (piece.color === BLACK) return true
          }
          continue
        }

        /* if the piece is a knight or a king */
        if (piece.type === 'n' || piece.type === 'k') return true

        var offset = RAYS[index]
        var j = i + offset

        var blocked = false
        while (j !== square) {
          if (board[j] != null) {
            blocked = true
            break
          }
          j += offset
        }

        if (!blocked) return true
      }
    }

    return false
  }

  function king_attacked(color) {
    return attacked(swap_color(color), kings[color])
  }

  function in_check() {
    return king_attacked(turn)
  }

  function in_checkmate() {
    return in_check() && generate_moves().length === 0
  }

  function in_stalemate() {
    return !in_check() && generate_moves().length === 0
  }

  function insufficient_material() {
    var pieces = {}
    var bishops = []
    var num_pieces = 0
    var sq_color = 0

    for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
      sq_color = (sq_color + 1) % 2
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece) {
        pieces[piece.type] = piece.type in pieces ? pieces[piece.type] + 1 : 1
        if (piece.type === BISHOP) {
          bishops.push(sq_color)
        }
        num_pieces++
      }
    }

    /* k vs. k */
    if (num_pieces === 2) {
      return true
    } else if (
      /* k vs. kn .... or .... k vs. kb */
      num_pieces === 3 &&
      (pieces[BISHOP] === 1 || pieces[KNIGHT] === 1)
    ) {
      return true
    } else if (num_pieces === pieces[BISHOP] + 2) {
      /* kb vs. kb where any number of bishops are all on the same color */
      var sum = 0
      var len = bishops.length
      for (var i = 0; i < len; i++) {
        sum += bishops[i]
      }
      if (sum === 0 || sum === len) {
        return true
      }
    }

    return false
  }

  function in_threefold_repetition() {
    /* TODO: while this function is fine for casual use, a better
     * implementation would use a Zobrist key (instead of FEN). the
     * Zobrist key would be maintained in the make_move/undo_move functions,
     * avoiding the costly that we do below.
     */
    var moves = []
    var positions = {}
    var repetition = false

    while (true) {
      var move = undo_move()
      if (!move) break
      moves.push(move)
    }

    while (true) {
      /* remove the last two fields in the FEN string, they're not needed
       * when checking for draw by rep */
      var fen = generate_fen().split(' ').slice(0, 4).join(' ')

      /* has the position occurred three or move times */
      positions[fen] = fen in positions ? positions[fen] + 1 : 1
      if (positions[fen] >= 3) {
        repetition = true
      }

      if (!moves.length) {
        break
      }
      make_move(moves.pop())
    }

    return repetition
  }

  function push(move) {
    history.push({
      move: move,
      kings: { b: kings.b, w: kings.w },
      turn: turn,
      castling: { b: castling.b, w: castling.w },
      ep_square: ep_square,
      half_moves: half_moves,
      move_number: move_number,
    })
  }

  function make_move(move) {
    var us = turn
    var them = swap_color(us)
    push(move)

    board[move.to] = board[move.from]
    board[move.from] = null

    /* if ep capture, remove the captured pawn */
    if (move.flags & BITS.EP_CAPTURE) {
      if (turn === BLACK) {
        board[move.to - 16] = null
      } else {
        board[move.to + 16] = null
      }
    }

    /* if pawn promotion, replace with new piece */
    if (move.flags & BITS.PROMOTION) {
      board[move.to] = { type: move.promotion, color: us }
    }

    /* if we moved the king */
    if (board[move.to].type === KING) {
      kings[board[move.to].color] = move.to

      /* if we castled, move the rook next to the king */
      if (move.flags & BITS.KSIDE_CASTLE) {
        var castling_to = move.to - 1
        var castling_from = move.to + 1
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        var castling_to = move.to + 1
        var castling_from = move.to - 2
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      }

      /* turn off castling */
      castling[us] = ''
    }

    /* turn off castling if we move a rook */
    if (castling[us]) {
      for (var i = 0, len = ROOKS[us].length; i < len; i++) {
        if (
          move.from === ROOKS[us][i].square &&
          castling[us] & ROOKS[us][i].flag
        ) {
          castling[us] ^= ROOKS[us][i].flag
          break
        }
      }
    }

    /* turn off castling if we capture a rook */
    if (castling[them]) {
      for (var i = 0, len = ROOKS[them].length; i < len; i++) {
        if (
          move.to === ROOKS[them][i].square &&
          castling[them] & ROOKS[them][i].flag
        ) {
          castling[them] ^= ROOKS[them][i].flag
          break
        }
      }
    }

    /* if big pawn move, update the en passant square */
    if (move.flags & BITS.BIG_PAWN) {
      if (turn === 'b') {
        ep_square = move.to - 16
      } else {
        ep_square = move.to + 16
      }
    } else {
      ep_square = EMPTY
    }

    /* reset the 50 move counter if a pawn is moved or a piece is captured */
    if (move.piece === PAWN) {
      half_moves = 0
    } else if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
      half_moves = 0
    } else {
      half_moves++
    }

    if (turn === BLACK) {
      move_number++
    }
    turn = swap_color(turn)
  }

  function undo_move() {
    var old = history.pop()
    if (old == null) {
      return null
    }

    var move = old.move
    kings = old.kings
    turn = old.turn
    castling = old.castling
    ep_square = old.ep_square
    half_moves = old.half_moves
    move_number = old.move_number

    var us = turn
    var them = swap_color(turn)

    board[move.from] = board[move.to]
    board[move.from].type = move.piece // to undo any promotions
    board[move.to] = null

    if (move.flags & BITS.CAPTURE) {
      board[move.to] = { type: move.captured, color: them }
    } else if (move.flags & BITS.EP_CAPTURE) {
      var index
      if (us === BLACK) {
        index = move.to - 16
      } else {
        index = move.to + 16
      }
      board[index] = { type: PAWN, color: them }
    }

    if (move.flags & (BITS.KSIDE_CASTLE | BITS.QSIDE_CASTLE)) {
      var castling_to, castling_from
      if (move.flags & BITS.KSIDE_CASTLE) {
        castling_to = move.to + 1
        castling_from = move.to - 1
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        castling_to = move.to - 2
        castling_from = move.to + 1
      }

      board[castling_to] = board[castling_from]
      board[castling_from] = null
    }

    return move
  }

  // convert a move from Standard Algebraic Notation (SAN) to 0x88 coordinates
  function move_from_san(move, sloppy) {
    // strip off any move decorations: e.g Nf3+?! becomes Nf3
    var clean_move = stripped_san(move)

    // the move parsers is a 2-step state
    for (var parser = 0; parser < 2; parser++) {
      if (parser == PARSER_SLOPPY) {
        // only run the sloppy parse if explicitly requested
        if (!sloppy) {
          return null
        }

        // The sloppy parser allows the user to parse non-standard chess
        // notations. This parser is opt-in (by specifying the
        // '{ sloppy: true }' setting) and is only run after the Standard
        // Algebraic Notation (SAN) parser has failed.
        //
        // When running the sloppy parser, we'll run a regex to grab the piece,
        // the to/from square, and an optional promotion piece. This regex will
        // parse common non-standard notation like: Pe2-e4, Rc1c4, Qf3xf7,
        // f7f8q, b1c3

        // NOTE: Some positions and moves may be ambiguous when using the
        // sloppy parser. For example, in this position:
        // 6k1/8/8/B7/8/8/8/BN4K1 w - - 0 1, the move b1c3 may be interpreted
        // as Nc3 or B1c3 (a disambiguated bishop move). In these cases, the
        // sloppy parser will default to the most most basic interpretation
        // (which is b1c3 parsing to Nc3).

        // FIXME: these var's are hoisted into function scope, this will need
        // to change when switching to const/let

        var overly_disambiguated = false

        var matches = clean_move.match(
          /([pnbrqkPNBRQK])?([a-h][1-8])x?-?([a-h][1-8])([qrbnQRBN])?/
        )
        if (matches) {
          var piece = matches[1]
          var from = matches[2]
          var to = matches[3]
          var promotion = matches[4]

          if (from.length == 1) {
            overly_disambiguated = true
          }
        } else {
          // The [a-h]?[1-8]? portion of the regex below handles moves that may
          // be overly disambiguated (e.g. Nge7 is unnecessary and non-standard
          // when there is one legal knight move to e7). In this case, the value
          // of 'from' variable will be a rank or file, not a square.
          var matches = clean_move.match(
            /([pnbrqkPNBRQK])?([a-h]?[1-8]?)x?-?([a-h][1-8])([qrbnQRBN])?/
          )

          if (matches) {
            var piece = matches[1]
            var from = matches[2]
            var to = matches[3]
            var promotion = matches[4]

            if (from.length == 1) {
              var overly_disambiguated = true
            }
          }
        }
      }

      var piece_type = infer_piece_type(clean_move)
      var moves = generate_moves({
        legal: true,
        piece: piece ? piece : piece_type,
      })

      for (var i = 0, len = moves.length; i < len; i++) {
        switch (parser) {
          case PARSER_STRICT: {
            if (clean_move === stripped_san(move_to_san(moves[i], moves))) {
              return moves[i]
            }
            break
          }
          case PARSER_SLOPPY: {
            if (matches) {
              // hand-compare move properties with the results from our sloppy
              // regex
              if (
                (!piece || piece.toLowerCase() == moves[i].piece) &&
                SQUARE_MAP[from] == moves[i].from &&
                SQUARE_MAP[to] == moves[i].to &&
                (!promotion || promotion.toLowerCase() == moves[i].promotion)
              ) {
                return moves[i]
              } else if (overly_disambiguated) {
                // SPECIAL CASE: we parsed a move string that may have an
                // unneeded rank/file disambiguator (e.g. Nge7).  The 'from'
                // variable will
                var square = algebraic(moves[i].from)
                if (
                  (!piece || piece.toLowerCase() == moves[i].piece) &&
                  SQUARE_MAP[to] == moves[i].to &&
                  (from == square[0] || from == square[1]) &&
                  (!promotion || promotion.toLowerCase() == moves[i].promotion)
                ) {
                  return moves[i]
                }
              }
            }
          }
        }
      }
    }

    return null
  }

  /* pretty = external move object */
  function make_pretty(ugly_move) {
    var move = clone(ugly_move)
    move.san = move_to_san(move, generate_moves({ legal: true }))
    move.to = algebraic(move.to)
    move.from = algebraic(move.from)

    var flags = ''

    for (var flag in BITS) {
      if (BITS[flag] & move.flags) {
        flags += FLAGS[flag]
      }
    }
    move.flags = flags

    return move
  }

  /*****************************************************************************
   * DEBUGGING UTILITIES
   ****************************************************************************/
  function perft(depth) {
    var moves = generate_moves({ legal: false })
    var nodes = 0
    var color = turn

    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(color)) {
        if (depth - 1 > 0) {
          var child_nodes = perft(depth - 1)
          nodes += child_nodes
        } else {
          nodes++
        }
      }
      undo_move()
    }

    return nodes
  }

  return {
    /***************************************************************************
     * PUBLIC API
     **************************************************************************/
    load: function (fen) {
      return load(fen)
    },

    reset: function () {
      return reset()
    },

    moves: function (options) {
      /* The internal representation of a chess move is in 0x88 format, and
       * not meant to be human-readable.  The code below converts the 0x88
       * square coordinates to algebraic coordinates.  It also prunes an
       * unnecessary move keys resulting from a verbose call.
       */

      var ugly_moves = generate_moves(options)
      var moves = []

      for (var i = 0, len = ugly_moves.length; i < len; i++) {
        /* does the user want a full move object (most likely not), or just
         * SAN
         */
        if (
          typeof options !== 'undefined' &&
          'verbose' in options &&
          options.verbose
        ) {
          moves.push(make_pretty(ugly_moves[i]))
        } else {
          moves.push(
            move_to_san(ugly_moves[i], generate_moves({ legal: true }))
          )
        }
      }

      return moves
    },

    in_check: function () {
      return in_check()
    },

    in_checkmate: function () {
      return in_checkmate()
    },

    in_stalemate: function () {
      return in_stalemate()
    },

    in_draw: function () {
      return (
        half_moves >= 100 ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()
      )
    },

    insufficient_material: function () {
      return insufficient_material()
    },

    in_threefold_repetition: function () {
      return in_threefold_repetition()
    },

    game_over: function () {
      return (
        half_moves >= 100 ||
        in_checkmate() ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()
      )
    },

    validate_fen: function (fen) {
      return validate_fen(fen)
    },

    fen: function () {
      return generate_fen()
    },

    board: function () {
      var output = [],
        row = []

      for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
        if (board[i] == null) {
          row.push(null)
        } else {
          row.push({
            square: algebraic(i),
            type: board[i].type,
            color: board[i].color,
          })
        }
        if ((i + 1) & 0x88) {
          output.push(row)
          row = []
          i += 8
        }
      }

      return output
    },

    header: function () {
      return set_header(arguments)
    },

    turn: function () {
      return turn
    },

    move: function (move, options) {
      /* The move function can be called with in the following parameters:
       *
       * .move('Nxb7')      <- where 'move' is a case-sensitive SAN string
       *
       * .move({ from: 'h7', <- where the 'move' is a move object (additional
       *         to :'h8',      fields are ignored)
       *         promotion: 'q',
       *      })
       */

      // allow the user to specify the sloppy move parser to work around over
      // disambiguation bugs in Fritz and Chessbase
      var sloppy =
        typeof options !== 'undefined' && 'sloppy' in options
          ? options.sloppy
          : false

      var move_obj = null

      if (typeof move === 'string') {
        move_obj = move_from_san(move, sloppy)
      } else if (typeof move === 'object') {
        var moves = generate_moves()

        /* convert the pretty move object to an ugly move object */
        for (var i = 0, len = moves.length; i < len; i++) {
          if (
            move.from === algebraic(moves[i].from) &&
            move.to === algebraic(moves[i].to) &&
            (!('promotion' in moves[i]) ||
              move.promotion === moves[i].promotion)
          ) {
            move_obj = moves[i]
            break
          }
        }
      }

      /* failed to find move */
      if (!move_obj) {
        return null
      }

      /* need to make a copy of move because we can't generate SAN after the
       * move is made
       */
      var pretty_move = make_pretty(move_obj)

      make_move(move_obj)

      return pretty_move
    },

    undo: function () {
      var move = undo_move()
      return move ? make_pretty(move) : null
    },

    clear: function () {
      return clear()
    },

    put: function (piece, square) {
      return put(piece, square)
    },

    get: function (square) {
      return get(square)
    },

    ascii() {
      var s = '   +------------------------+\n'
      for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
        /* display the rank */
        if (file(i) === 0) {
          s += ' ' + '87654321'[rank(i)] + ' |'
        }

        /* empty piece */
        if (board[i] == null) {
          s += ' . '
        } else {
          var piece = board[i].type
          var color = board[i].color
          var symbol =
            color === WHITE ? piece.toUpperCase() : piece.toLowerCase()
          s += ' ' + symbol + ' '
        }

        if ((i + 1) & 0x88) {
          s += '|\n'
          i += 8
        }
      }
      s += '   +------------------------+\n'
      s += '     a  b  c  d  e  f  g  h'

      return s
    },

    remove: function (square) {
      return remove(square)
    },

    perft: function (depth) {
      return perft(depth)
    },

    square_color: function (square) {
      if (square in SQUARE_MAP) {
        var sq_0x88 = SQUARE_MAP[square]
        return (rank(sq_0x88) + file(sq_0x88)) % 2 === 0 ? 'light' : 'dark'
      }

      return null
    },

    history: function (options) {
      var reversed_history = []
      var move_history = []
      var verbose =
        typeof options !== 'undefined' &&
        'verbose' in options &&
        options.verbose

      while (history.length > 0) {
        reversed_history.push(undo_move())
      }

      while (reversed_history.length > 0) {
        var move = reversed_history.pop()
        if (verbose) {
          move_history.push(make_pretty(move))
        } else {
          move_history.push(move_to_san(move, generate_moves({ legal: true })))
        }
        make_move(move)
      }

      return move_history
    },
  }
}
</script>

<script>
(function () {
  'use strict';

  // =====================================================================
  // Utilities: escaping, safe markdown-subset renderer, eval formatting
  // =====================================================================

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function escapeText(node, text) {
    node.textContent = text == null ? '' : String(text);
  }

  // Renders a small, injection-safe markdown subset: ## / ### headings,
  // **bold**, _italic_, `code`, - bullet lists, 1. ordered lists, blank-line
  // paragraphs, [text](url) links (http/https/mailto only). The source is
  // HTML-escaped FIRST, then a handful of regexes turn the escaped text into
  // real tags — so no HTML ever reaches innerHTML except tags this function
  // itself introduced. Never feed this function already-HTML content.
  function renderInlineMarkdown(escaped) {
    var out = escaped;
    out = out.replace(/`([^`]+)`/g, function (m, code) { return '<code>' + code + '</code>'; });
    out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g, function (m, txt, url) {
      return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + txt + '</a>';
    });
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/(^|[^\w])_([^_]+)_(?!\w)/g, '$1<em>$2</em>');
    return out;
  }

  function renderMarkdown(src) {
    var escaped = escapeHtml(src);
    var lines = escaped.split(/\r?\n/);
    var html = '';
    var listBuffer = null; // { type: 'ul'|'ol', items: [] }
    var paraBuffer = [];

    function flushList() {
      if (!listBuffer) return;
      var tag = listBuffer.type;
      html += '<' + tag + '>' + listBuffer.items.map(function (it) {
        return '<li>' + renderInlineMarkdown(it) + '</li>';
      }).join('') + '</' + tag + '>';
      listBuffer = null;
    }
    function flushPara() {
      if (paraBuffer.length) {
        html += '<p>' + renderInlineMarkdown(paraBuffer.join(' ')) + '</p>';
        paraBuffer = [];
      }
    }

    for (var i = 0; i < lines.length; i++) {
      var trimmed = lines[i].trim();
      if (!trimmed) { flushPara(); flushList(); continue; }
      var m;
      if ((m = trimmed.match(/^###\s+(.*)$/))) { flushPara(); flushList(); html += '<h3>' + renderInlineMarkdown(m[1]) + '</h3>'; continue; }
      if ((m = trimmed.match(/^##\s+(.*)$/))) { flushPara(); flushList(); html += '<h2>' + renderInlineMarkdown(m[1]) + '</h2>'; continue; }
      if ((m = trimmed.match(/^-\s+(.*)$/))) {
        flushPara();
        if (!listBuffer || listBuffer.type !== 'ul') { flushList(); listBuffer = { type: 'ul', items: [] }; }
        listBuffer.items.push(m[1]);
        continue;
      }
      if ((m = trimmed.match(/^\d+\.\s+(.*)$/))) {
        flushPara();
        if (!listBuffer || listBuffer.type !== 'ol') { flushList(); listBuffer = { type: 'ol', items: [] }; }
        listBuffer.items.push(m[1]);
        continue;
      }
      flushList();
      paraBuffer.push(trimmed);
    }
    flushPara();
    flushList();
    return html;
  }

  function renderMarkdownInto(el, src) {
    el.innerHTML = renderMarkdown(src == null ? '' : src);
  }

  function clamp(n, min, max) {
    return Math.min(Math.max(n, min), max);
  }

  // Formats a centipawn/mate score as e.g. "+0.34" or "-1.20" or "M3"/"-M3".
  // `forWhite` — when the caller has a score from a specific side's
  // perspective (UCI scores are always from the side-to-move's perspective)
  // pass the FEN's turn so the sign can be normalized to "white advantage
  // positive" for consistent display.
  function fmtScore(cp, mate) {
    if (typeof mate === 'number' && mate !== null) {
      return (mate > 0 ? 'M' + mate : '-M' + Math.abs(mate));
    }
    if (typeof cp !== 'number' || cp === null || isNaN(cp)) return '—';
    var pawns = cp / 100;
    var sign = pawns > 0 ? '+' : (pawns < 0 ? '' : '±');
    return sign + pawns.toFixed(2);
  }

  // Normalizes a UCI score (always from side-to-move's perspective) to
  // "positive = white is better" for bar/graph rendering.
  function normalizeToWhite(cp, mate, turnIsWhite) {
    var sign = turnIsWhite ? 1 : -1;
    return {
      cp: typeof cp === 'number' ? cp * sign : null,
      mate: typeof mate === 'number' ? mate * sign : null,
    };
  }

  function uciToMoveParts(uci) {
    if (!uci || uci.length < 4) return null;
    return {
      from: uci.slice(0, 2),
      to: uci.slice(2, 4),
      promotion: uci.length > 4 ? uci[4] : undefined,
    };
  }

  // Replays a UCI principal variation (e.g. "e2e4 e7e5 g1f3") from a FEN into
  // a SAN string (e.g. "e4 e5 Nf3"), stopping early (with a trailing "…") if
  // any move fails to apply (shouldn't happen for a legal engine PV, but a
  // truncated `go` result at low depth can hand back a partial line).
  function uciPvToSan(fen, pvUci, maxMoves) {
    var replay = Chess(fen);
    var out = [];
    var tokens = (pvUci || []).slice(0, maxMoves || 6);
    for (var i = 0; i < tokens.length; i++) {
      var parts = uciToMoveParts(tokens[i]);
      if (!parts) break;
      var result = replay.move({ from: parts.from, to: parts.to, promotion: parts.promotion });
      if (!result) { out.push('…'); break; }
      out.push(result.san);
    }
    return out.join(' ');
  }

  // =====================================================================
  // Conversation panel: hydrate /transcript, subscribe /events, /submit.
  // Same contract as the other shells. Two kinds of things get POSTed to
  // /submit here: plain learner questions typed into the coach drawer (sent
  // as-is), and structured telemetry the shell itself emits on meaningful
  // learner actions, JSON-encoded as {kind:'chapter-event', ...} so the
  // debrief turn can tell a question from an event.
  // =====================================================================

  var chatLog = document.getElementById('chat-log');
  var chatForm = document.getElementById('chat-form');
  var chatInput = document.getElementById('chat-input');
  var liveDot = document.getElementById('live-dot');
  var liveLabel = document.getElementById('live-label');
  var coachToggle = document.getElementById('coach-toggle');
  var coachDrawer = document.getElementById('coach-drawer');
  var coachClose = document.getElementById('coach-close');
  var chatStarted = false;
  var unreadCount = 0;

  function clearEmptyState() {
    if (!chatStarted) {
      chatStarted = true;
      chatLog.innerHTML = '';
    }
  }

  function appendChat(entry) {
    clearEmptyState();
    var row = document.createElement('div');
    row.className = 'chat-entry chat-' + (entry.role === 'learner' ? 'learner' : 'agent');
    var roleEl = document.createElement('span');
    roleEl.className = 'chat-role';
    escapeText(roleEl, entry.role);
    var textEl = document.createElement('span');
    escapeText(textEl, entry.text);
    row.appendChild(roleEl);
    row.appendChild(textEl);
    chatLog.appendChild(row);
    chatLog.scrollTop = chatLog.scrollHeight;
    if (entry.role !== 'learner' && coachDrawer.hidden) {
      unreadCount += 1;
      updateCoachBadge();
    }
  }

  function updateCoachBadge() {
    var existing = coachToggle.querySelector('.badge');
    if (unreadCount > 0) {
      if (!existing) {
        existing = document.createElement('span');
        existing.className = 'badge';
        coachToggle.appendChild(existing);
      }
      existing.textContent = String(unreadCount);
    } else if (existing) {
      existing.remove();
    }
  }

  function openCoach(seedText) {
    coachDrawer.hidden = false;
    coachToggle.setAttribute('aria-expanded', 'true');
    unreadCount = 0;
    updateCoachBadge();
    if (typeof seedText === 'string') {
      chatInput.value = seedText;
    }
    chatInput.focus();
    if (typeof seedText === 'string') {
      var len = seedText.length;
      try { chatInput.setSelectionRange(len, len); } catch (e) {}
    }
  }
  function closeCoach() {
    coachDrawer.hidden = true;
    coachToggle.setAttribute('aria-expanded', 'false');
  }
  coachToggle.addEventListener('click', function () {
    if (coachDrawer.hidden) openCoach(); else closeCoach();
  });
  coachClose.addEventListener('click', closeCoach);

  async function hydrateTranscript() {
    try {
      var res = await fetch('/transcript');
      var entries = await res.json();
      entries.forEach(appendChat);
    } catch (err) {
      console.error('Could not load transcript', err);
    }
  }

  function submitText(text) {
    return fetch('/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text }),
    }).catch(function (err) {
      console.error('Could not submit', err);
    });
  }

  // Structured telemetry the agent debriefs from — see the event catalogue
  // in the design spec: section-viewed, exercise-attempted, exercise-solved,
  // hint-revealed, line-explored, quiz-answered, chapter-completed.
  function emitEvent(event, sectionId, blockIndex, payload) {
    var envelope = {
      kind: 'chapter-event',
      event: event,
      section: sectionId,
      block: blockIndex,
      payload: payload || {},
      at: new Date().toISOString(),
    };
    return submitText(JSON.stringify(envelope));
  }

  function subscribeEvents(onState) {
    var source = new EventSource('/events');
    source.onopen = function () {
      liveDot.className = 'live-dot ok';
      liveLabel.textContent = 'live';
    };
    source.onerror = function () {
      liveDot.className = 'live-dot bad';
      liveLabel.textContent = 'reconnecting…';
    };
    source.onmessage = function (event) {
      var msg;
      try {
        msg = JSON.parse(event.data);
      } catch (e) {
        return;
      }
      if (msg.kind === 'chat') {
        appendChat(msg);
      } else if (msg.kind === 'state' && typeof onState === 'function') {
        onState(msg.data);
      }
    };
  }

  chatForm.addEventListener('submit', function (event) {
    event.preventDefault();
    var text = chatInput.value.trim();
    if (!text) return;
    chatInput.value = '';
    submitText(text);
  });

  function askAboutButton(sectionHeading, blockType, sectionId, blockIndex) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ask-about';
    btn.textContent = 'Ask about this';
    btn.setAttribute('aria-label', 'Ask the coach about this ' + blockType + ' block');
    btn.addEventListener('click', function () {
      openCoach('About "' + sectionHeading + '" → ' + blockType + ': ');
      emitEvent('ask-opened', sectionId, blockIndex, { blockType: blockType });
    });
    return btn;
  }

  // =====================================================================
  // Engine manager: ONE shared Stockfish WASM worker for the whole page,
  // with a depth-1 request queue (a new request supersedes any pending one
  // rather than piling up). Feature-detects multithreaded vs single-thread
  // build via self.crossOriginIsolated, and degrades to `available:false`
  // (hiding all eval UI, never breaking anything else) if both fail to
  // load — e.g. the --assets flag hasn't been wired up yet, or the files
  // are missing. See docs/superpowers/specs/
  // 2026-08-16-chapter-mode-engine-coaching-design.md section 3b.
  // =====================================================================

  var ENGINE_ASSET_MULTI = '/assets/stockfish-18-lite.js';
  var ENGINE_ASSET_SINGLE = '/assets/stockfish-18-lite-single.js';
  var ENGINE_BOOT_TIMEOUT_MS = 10000;

  var Engine = (function () {
    var worker = null;
    var available = null; // null = unknown/booting, true/false once resolved
    var bootPromise = null;
    var busy = false;
    var currentJob = null;
    var pendingJob = null;
    var listeners = [];
    var activeEngineName = null;

    function notify() {
      listeners.forEach(function (fn) {
        try { fn(available); } catch (e) { /* listener errors must not break the engine */ }
      });
    }

    function onAvailability(fn) {
      listeners.push(fn);
      if (available !== null) fn(available);
      return function () {
        var idx = listeners.indexOf(fn);
        if (idx >= 0) listeners.splice(idx, 1);
      };
    }

    function tryBoot(url) {
      return new Promise(function (resolve, reject) {
        var settled = false;
        var w;
        try {
          w = new Worker(url);
        } catch (err) {
          reject(err);
          return;
        }
        var timeout = setTimeout(function () {
          if (settled) return;
          settled = true;
          try { w.terminate(); } catch (e) {}
          reject(new Error('engine boot timeout: ' + url));
        }, ENGINE_BOOT_TIMEOUT_MS);

        w.onerror = function (err) {
          if (settled) return;
          settled = true;
          clearTimeout(timeout);
          try { w.terminate(); } catch (e) {}
          reject(err);
        };
        w.onmessage = function (e) {
          var line = typeof e.data === 'string' ? e.data : '';
          if (line.indexOf('uciok') !== -1) {
            if (settled) return;
            settled = true;
            clearTimeout(timeout);
            w.onmessage = handleMessage;
            w.postMessage('isready');
            resolve(w);
          }
        };
        try {
          w.postMessage('uci');
        } catch (err) {
          clearTimeout(timeout);
          reject(err);
        }
      });
    }

    function bootOnce() {
      if (bootPromise) return bootPromise;
      var preferred = (typeof window !== 'undefined' && window.crossOriginIsolated) ? ENGINE_ASSET_MULTI : ENGINE_ASSET_SINGLE;
      bootPromise = tryBoot(preferred).then(function (w) {
        worker = w;
        available = true;
        activeEngineName = preferred;
        notify();
        return true;
      }).catch(function () {
        if (preferred === ENGINE_ASSET_SINGLE) {
          available = false;
          notify();
          return false;
        }
        return tryBoot(ENGINE_ASSET_SINGLE).then(function (w) {
          worker = w;
          available = true;
          activeEngineName = ENGINE_ASSET_SINGLE;
          notify();
          return true;
        }).catch(function () {
          available = false;
          notify();
          return false;
        });
      });
      return bootPromise;
    }

    function parseInfoLine(line) {
      var depthMatch = line.match(/\bdepth (\d+)/);
      var multipvMatch = line.match(/\bmultipv (\d+)/);
      var cpMatch = line.match(/\bscore cp (-?\d+)/);
      var mateMatch = line.match(/\bscore mate (-?\d+)/);
      var pvMatch = line.match(/\bpv (.+)$/);
      if (!depthMatch || line.indexOf(' score ') === -1) return null;
      return {
        depth: Number(depthMatch[1]),
        multipv: multipvMatch ? Number(multipvMatch[1]) : 1,
        cp: cpMatch ? Number(cpMatch[1]) : null,
        mate: mateMatch ? Number(mateMatch[1]) : null,
        pv: pvMatch ? pvMatch[1].trim().split(/\s+/) : [],
      };
    }

    function handleMessage(e) {
      var line = typeof e.data === 'string' ? e.data : '';
      if (!currentJob) return;
      if (line.indexOf('info') === 0 && line.indexOf(' score ') !== -1) {
        var info = parseInfoLine(line);
        if (info) {
          currentJob.lines.set(info.multipv, info);
          if (typeof currentJob.onInfo === 'function') {
            var arr = Array.from(currentJob.lines.values()).sort(function (a, b) { return a.multipv - b.multipv; });
            currentJob.onInfo(arr);
          }
        }
      } else if (line.indexOf('bestmove') === 0) {
        var parts = line.split(/\s+/);
        var best = parts[1] === '(none)' ? null : parts[1];
        var finished = currentJob;
        currentJob = null;
        busy = false;
        if (finished && typeof finished.onBest === 'function') {
          var lines = Array.from(finished.lines.values()).sort(function (a, b) { return a.multipv - b.multipv; });
          finished.onBest(best, lines);
        }
        if (pendingJob) {
          var next = pendingJob;
          pendingJob = null;
          runJob(next);
        }
      }
    }

    function runJob(job) {
      busy = true;
      currentJob = job;
      job.lines = new Map();
      worker.postMessage('stop');
      worker.postMessage('setoption name MultiPV value ' + (job.multipv || 1));
      worker.postMessage('position fen ' + job.fen);
      worker.postMessage('go depth ' + (job.depth || 18));
    }

    // Requests analysis of `fen`. If the engine is mid-analysis, the running
    // job is stopped and this request becomes the sole pending job (never
    // queued alongside older ones) — "cancel superseded requests rather than
    // queueing them all up".
    function request(fen, opts) {
      opts = opts || {};
      var job = { fen: fen, depth: opts.depth || 18, multipv: opts.multipv || 1, onInfo: opts.onInfo, onBest: opts.onBest };
      return bootOnce().then(function (ok) {
        if (!ok) return false;
        if (busy) {
          worker.postMessage('stop');
          pendingJob = job;
        } else {
          runJob(job);
        }
        return true;
      });
    }

    // Drops any pending job and asks the engine to stop the current one.
    // Used when a board goes off-screen (IntersectionObserver) so it stops
    // consuming engine time, per the render-time engine requirements.
    function cancelPending() {
      pendingJob = null;
      if (busy && worker) {
        try { worker.postMessage('stop'); } catch (e) {}
      }
    }

    return {
      request: request,
