            text.setAttribute('stroke', color === 'w' ? '#1b1b18' : 'none');
            text.setAttribute('stroke-width', color === 'w' ? '1.2' : '0');
            text.textContent = glyph;
            if (interactive) text.addEventListener('click', function () { onSquareClick(square); });
            svg.appendChild(text);
          }

          if (legalDestinations.has(square)) {
            var marker2 = document.createElementNS(svgNs, 'circle');
            marker2.setAttribute('cx', x + SQUARE_PX / 2);
            marker2.setAttribute('cy', y + SQUARE_PX / 2);
            var isCapture = !!piece || legalDestinations.get(square).some(function (m) { return !!m.captured; });
            marker2.setAttribute('r', isCapture ? SQUARE_PX * 0.42 : SQUARE_PX * 0.16);
            marker2.setAttribute('fill', isCapture ? 'none' : 'var(--sq-legal)');
            marker2.setAttribute('stroke', isCapture ? 'var(--sq-legal-capture)' : 'none');
            marker2.setAttribute('stroke-width', isCapture ? '5' : '0');
            marker2.style.pointerEvents = 'none';
            svg.appendChild(marker2);
          }
        }
      });

      FILES.forEach(function (file, i) {
        var col = orientation === 'black' ? 7 - i : i;
        var label = document.createElementNS(svgNs, 'text');
        label.setAttribute('x', col * SQUARE_PX + SQUARE_PX - 6);
        label.setAttribute('y', 8 * SQUARE_PX - 4);
        label.setAttribute('font-size', '11');
        label.setAttribute('fill', 'var(--muted)');
        label.style.pointerEvents = 'none';
        label.textContent = file;
        svg.appendChild(label);
      });
      for (var rankNumber2 = 1; rankNumber2 <= 8; rankNumber2++) {
        var row = orientation === 'black' ? rankNumber2 - 1 : 8 - rankNumber2;
        var rlabel = document.createElementNS(svgNs, 'text');
        rlabel.setAttribute('x', 3);
        rlabel.setAttribute('y', row * SQUARE_PX + 13);
        rlabel.setAttribute('font-size', '11');
        rlabel.setAttribute('fill', 'var(--muted)');
        rlabel.style.pointerEvents = 'none';
        rlabel.textContent = rankNumber2;
        svg.appendChild(rlabel);
      }

      staticArrows.forEach(function (arrow) {
        if (arrow && arrow.from && arrow.to) drawArrow(arrow.from, arrow.to, arrow.color ? arrow.color : 'var(--arrow)');
      });
      if (engineArrow) drawArrow(engineArrow.from, engineArrow.to, 'var(--arrow-best)');

      svg.setAttribute('aria-label', (opts.ariaPrefix || 'Chess board') + ', ' + (chess.turn() === 'w' ? 'white' : 'black') + ' to move');
      updateStatus();
    }

    function finalizeMove(from, to, promotion) {
      var result = chess.move({ from: from, to: to, promotion: promotion });
      clearSelection();
      if (!result) { render(); return; }
      render();
      if (onMove) onMove(result, chess);
    }

    function showPromotionPicker(from, to, choices) {
      pendingPromotion = { from: from, to: to };
      promoPicker.innerHTML = '';
      promoPicker.hidden = false;
      var color = chess.turn();
      ['q', 'r', 'b', 'n'].forEach(function (piece) {
        if (!choices.some(function (m) { return m.promotion === piece; })) return;
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = PIECE_GLYPHS[color + piece];
        btn.setAttribute('aria-label', 'Promote to ' + piece);
        btn.addEventListener('click', function () { finalizeMove(from, to, piece); });
        promoPicker.appendChild(btn);
      });
    }

    function onSquareClick(square) {
      if (!interactive || pendingPromotion) return;

      if (selected && legalDestinations.has(square)) {
        var choices = legalDestinations.get(square);
        if (choices.length > 1) { showPromotionPicker(selected, square, choices); }
        else { finalizeMove(selected, square, choices[0].promotion); }
        return;
      }

      var piece = chess.get(square);
      if (selected === square) { clearSelection(); render(); return; }

      if (piece && piece.color === chess.turn()) {
        var verboseMoves = chess.moves({ square: square, verbose: true });
        if (verboseMoves.length === 0) { clearSelection(); render(); return; }
        selected = square;
        legalDestinations = new Map();
        verboseMoves.forEach(function (move) {
          if (!legalDestinations.has(move.to)) legalDestinations.set(move.to, []);
          legalDestinations.get(move.to).push(move);
        });
        render();
        if (typeof opts.onSelectionChange === 'function') opts.onSelectionChange(square, verboseMoves);
        return;
      }

      clearSelection();
      render();
    }

    render();

    return {
      el: holder,
      svg: svg,
      statusEl: statusEl,
      promoPicker: promoPicker,
      setFen: function (fen) { chess.load(fen); clearSelection(); render(); },
      getFen: function () { return chess.fen(); },
      getChess: function () { return chess; },
      setArrows: function (arrows) { staticArrows = arrows || []; render(); },
      setEngineArrow: function (fromTo) { engineArrow = fromTo; render(); },
      setHighlights: function (squares) { highlightSquares = squares || []; render(); },
      setInteractive: function (val) { interactive = !!val; svg.classList.toggle('readonly', !interactive); },
      isInteractive: function () { return interactive; },
      clearSelection: function () { clearSelection(); render(); },
      render: render,
    };
  }

  // =====================================================================
  // Wires a board widget up to the shared Engine: eval bar + collapsible
  // top-3 lines panel, analysed only while the board is the most-visible
  // analyzable board on screen (IntersectionObserver via VisibilityTracker),
  // and re-analysed whenever the board's position changes while active.
  // `setHidden(true)` is how exercise blocks keep all of this invisible
  // until the learner commits an answer — enforced here in the shell, not
  // left to chance in authored data.
  // =====================================================================

  function attachLiveAnalysis(widget, config) {
    config = config || {};
    var depth = config.depth || 18;
    var multipv = config.multipv || 3;
    var showBestArrow = config.showBestArrow !== false;
    var evalBar = createEvalBar();
    var topLines = createTopLinesPanel();
    var isActive = false;
    var hidden = !!config.startHidden;

    function syncVisibility() {
      var engineGone = Engine.isAvailable() === false;
      var show = !hidden && !engineGone;
      evalBar.el.hidden = !show;
      topLines.el.hidden = !show;
    }

    function requestAnalysis() {
      if (hidden || Engine.isAvailable() === false) return;
      var fen = widget.getFen();
      var turnIsWhite = fen.split(' ')[1] === 'w';
      evalBar.update({ thinking: true });
      Engine.request(fen, {
        depth: depth,
        multipv: multipv,
        onInfo: function (lines) {
          var top = lines[0];
          if (!top) return;
          var norm = normalizeToWhite(top.cp, top.mate, turnIsWhite);
          evalBar.update({ cpWhite: norm.cp, mateWhite: norm.mate, depth: top.depth, thinking: true });
          var normalizedLines = lines.map(function (l) {
            var n = normalizeToWhite(l.cp, l.mate, turnIsWhite);
            return { cpWhite: n.cp, mateWhite: n.mate, pv: l.pv, depth: l.depth };
          });
          topLines.update(fen, normalizedLines);
        },
        onBest: function (best, lines) {
          var top = lines[0];
          if (top) {
            var norm = normalizeToWhite(top.cp, top.mate, turnIsWhite);
            evalBar.update({ cpWhite: norm.cp, mateWhite: norm.mate, depth: top.depth, thinking: false });
          }
          if (best && showBestArrow && typeof widget.setEngineArrow === 'function') {
            var parts = uciToMoveParts(best);
            if (parts) widget.setEngineArrow({ from: parts.from, to: parts.to });
          }
        },
      });
    }

    var visEntry = {
      onActive: function () { isActive = true; requestAnalysis(); },
      onInactive: function () { isActive = false; Engine.cancelPending(); },
    };
    VisibilityTracker.register(widget.el, visEntry);
    var unsubscribe = Engine.onAvailability(function () { syncVisibility(); });
    syncVisibility();

    return {
      evalBarEl: evalBar.el,
      topLinesEl: topLines.el,
      setHidden: function (val) {
        hidden = !!val;
        syncVisibility();
        if (!hidden && isActive) requestAnalysis();
      },
      refresh: function () { if (isActive) requestAnalysis(); },
      // One-shot analysis regardless of visibility/active state — used for
      // the exercise "engine says" fallback and compare-block live evals.
      runOnce: function (fen, oneOffOpts) {
        oneOffOpts = oneOffOpts || {};
        return new Promise(function (resolve) {
          var turnIsWhite = fen.split(' ')[1] === 'w';
          Engine.request(fen, {
            depth: oneOffOpts.depth || depth,
            multipv: 1,
            onBest: function (best, lines) {
              var top = lines[0];
              var norm = top ? normalizeToWhite(top.cp, top.mate, turnIsWhite) : { cp: null, mate: null };
              resolve({ best: best, cpWhite: norm.cp, mateWhite: norm.mate, depth: top ? top.depth : null, pv: top ? top.pv : [] });
            },
          });
        });
      },
      destroy: function () {
        VisibilityTracker.unregister(widget.el);
        if (unsubscribe) unsubscribe();
      },
    };
  }

  function engineUnavailableNote() {
    var note = document.createElement('p');
    note.className = 'eval-hidden-note';
    note.textContent = '';
    Engine.onAvailability(function (available) {
      note.hidden = available !== false;
      note.textContent = available === false ? 'Live engine unavailable in this session — everything else still works.' : '';
    });
    return note;
  }

  // =====================================================================
  // Lightweight PGN move-text parser. The vendored chess.js above is the
  // legal-move-generation build only (no load_pgn/pgn — see its header
  // comment), so PGN support here is a small, deliberately narrow replay:
  // headers, move numbers, {comments}, ;line comments and $NAGs are
  // stripped; the remaining SAN tokens are replayed move-by-move with the
  // sloppy parser. Recursive variations (RAVs in nested parens) are
  // dropped, not rendered — chapters are expected to author one mainline
  // per `game` block.
  // =====================================================================

  function parsePgn(pgn) {
    var raw = String(pgn || '');
    var headers = {};
    raw.replace(/^\[(\w+)\s+"([^"]*)"\]\s*$/gm, function (m, key, val) {
      headers[key] = val;
      return '';
    });
    var movetext = raw.replace(/^\[.*\]\s*$/gm, ' ');
    movetext = movetext.replace(/\{[^}]*\}/g, ' ');
    movetext = movetext.replace(/;[^\n]*/g, ' ');
    movetext = movetext.replace(/\([^()]*\)/g, ' '); // one level of RAV
    movetext = movetext.replace(/\$\d+/g, ' ');
    movetext = movetext.replace(/\b\d+\.(\.\.)?/g, ' ');
    movetext = movetext.replace(/1-0|0-1|1\/2-1\/2|\*/g, ' ');
    var tokens = movetext.split(/\s+/).map(function (t) { return t.trim(); }).filter(Boolean);

    var startFen = (headers.SetUp === '1' && headers.FEN) ? headers.FEN : undefined;
    var replay = Chess(startFen);
    var positions = [replay.fen()];
    var moves = [];
    for (var i = 0; i < tokens.length; i++) {
      var result = replay.move(tokens[i], { sloppy: true });
      if (!result) continue; // skip unparseable tokens rather than aborting the whole game
      moves.push(result);
      positions.push(replay.fen());
    }
    return { headers: headers, moves: moves, positions: positions, startFen: startFen || positions[0] };
  }

  // =====================================================================
  // Exercise-answer matching. `move` answers are compared via chess.js move
  // objects (from/to/promotion) rather than string equality so "Nf3" and
  // "Ng1-f3" both match the same authored answer, per the design contract.
  // =====================================================================

  function movesEquivalent(fen, sanA, sanB) {
    try {
      var a = Chess(fen).move(sanA, { sloppy: true });
      var b = Chess(fen).move(sanB, { sloppy: true });
      if (!a || !b) return false;
      return a.from === b.from && a.to === b.to && (a.promotion || '') === (b.promotion || '');
    } catch (e) {
      return false;
    }
  }

  // =====================================================================
  // Block renderers. Each takes (block, ctx) where ctx = {sectionId,
  // sectionHeading, blockIndex} and returns a `.block` wrapper element
  // (which already carries the "ask about this" affordance).
  // =====================================================================

  function setInlineMarkdown(el, text) {
    el.innerHTML = renderInlineMarkdown(escapeHtml(text == null ? '' : text));
  }

  function createBlockWrapper(extraClass, ctx, blockType) {
    var wrap = document.createElement('div');
    wrap.className = 'block ' + extraClass;
    wrap.appendChild(askAboutButton(ctx.sectionHeading, blockType, ctx.sectionId, ctx.blockIndex));
    return wrap;
  }

  function renderProseBlock(block, ctx) {
    var wrap = createBlockWrapper('block-prose', ctx, 'prose');
    var div = document.createElement('div');
    div.className = 'prose';
    renderMarkdownInto(div, block.body);
    wrap.appendChild(div);
    return wrap;
  }

  var CALLOUT_TITLES = { principle: 'Principle', theory: 'Theory', warning: 'Warning', insight: 'Insight' };
  var CALLOUT_VARIANTS = ['principle', 'theory', 'warning', 'insight'];

  function renderCalloutBlock(block, ctx) {
    var variant = CALLOUT_VARIANTS.indexOf(block.variant) >= 0 ? block.variant : 'theory';
    var wrap = createBlockWrapper('block-callout', ctx, 'callout');
    var box = document.createElement('div');
    box.className = 'callout callout-' + variant;
    var title = document.createElement('div');
    title.className = 'callout-title';
    escapeText(title, block.title || CALLOUT_TITLES[variant]);
    box.appendChild(title);
    var body = document.createElement('div');
    body.className = 'prose';
    renderMarkdownInto(body, block.body);
    box.appendChild(body);
    wrap.appendChild(box);
    return wrap;
  }

  function renderRecapBlock(block, ctx) {
    var wrap = createBlockWrapper('block-recap', ctx, 'recap');
    var ul = document.createElement('ul');
    ul.className = 'recap-list';
    (block.points || []).forEach(function (point) {
      var li = document.createElement('li');
      setInlineMarkdown(li, point);
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
    return wrap;
  }

  function renderQuizBlock(block, ctx) {
    var wrap = createBlockWrapper('block-quiz', ctx, 'quiz');
    var question = document.createElement('p');
    question.className = 'quiz-question';
    setInlineMarkdown(question, block.question);
    wrap.appendChild(question);

    var optionsWrap = document.createElement('div');
    optionsWrap.className = 'quiz-options';
    var attempt = 0;

    (block.options || []).forEach(function (opt, optIndex) {
      var row = document.createElement('div');
      var optEl = document.createElement('button');
      optEl.type = 'button';
      optEl.className = 'exercise-option';
      setInlineMarkdown(optEl, opt.text);
      var feedbackEl = document.createElement('div');
      feedbackEl.className = 'quiz-option-feedback';
      feedbackEl.hidden = true;
      row.appendChild(optEl);
      row.appendChild(feedbackEl);
      optionsWrap.appendChild(row);

      optEl.addEventListener('click', function () {
        attempt += 1;
        Array.prototype.forEach.call(optionsWrap.querySelectorAll('.exercise-option'), function (el) {
          el.classList.remove('correct', 'incorrect');
        });
        Array.prototype.forEach.call(optionsWrap.querySelectorAll('.quiz-option-feedback'), function (el) {
          el.hidden = true;
        });
        optEl.classList.add(opt.correct ? 'correct' : 'incorrect');
        feedbackEl.hidden = false;
        setInlineMarkdown(feedbackEl, opt.feedback || (opt.correct ? 'Correct.' : 'Not quite — try another option.'));
        emitEvent('quiz-answered', ctx.sectionId, ctx.blockIndex, { optionIndex: optIndex, correct: !!opt.correct, attempt: attempt });
        if (opt.correct) markSectionProgress(ctx.sectionId, 'done');
      });
    });
    wrap.appendChild(optionsWrap);
    return wrap;
  }

  // One-shot analysis independent of any board widget/visibility wiring —
  // used by the exercise "engine says" fallback and the compare block's
  // live-eval-when-not-authored path, where a single answer is wanted
  // rather than continuous re-analysis of a board on screen.
  function analyzeOnce(fen, depth) {
    return new Promise(function (resolve) {
      if (Engine.isAvailable() === false) { resolve(null); return; }
      var turnIsWhite = fen.split(' ')[1] === 'w';
      Engine.request(fen, {
        depth: depth || 14,
        multipv: 1,
        onBest: function (best, lines) {
          var top = lines[0];
          if (!top) { resolve(null); return; }
          var norm = normalizeToWhite(top.cp, top.mate, turnIsWhite);
          resolve({ best: best, cpWhite: norm.cp, mateWhite: norm.mate, depth: top.depth, pv: top.pv });
        },
      });
    });
  }

  function renderBoardBlock(block, ctx) {
    var wrap = createBlockWrapper('block-board', ctx, 'board');
    var card = document.createElement('div');
    card.className = 'board-card';

    var exploredMoves = [];
    var positions = null;
    var moveObjs = null;
    var currentStep = 0;

    var widget = createBoardWidget({
      fen: block.fen,
      orientation: block.orientation,
      interactive: !!block.interactive,
      arrows: block.arrows,
      highlights: block.highlights,
      ariaPrefix: ctx.sectionHeading + ' board',
      onMove: function (result) {
        exploredMoves.push(result.san);
        emitEvent('line-explored', ctx.sectionId, ctx.blockIndex, {
          startFen: positions ? positions[currentStep] : block.fen,
          moves: exploredMoves.slice(),
        });
        if (analysisCtl) analysisCtl.refresh();
      },
    });

    var row = document.createElement('div');
    row.className = 'board-row';
    row.appendChild(widget.el);

    var analysisCtl = null;
    if (block.analysis !== 'off') {
      analysisCtl = attachLiveAnalysis(widget, { depth: 18, multipv: 3 });
      row.appendChild(analysisCtl.evalBarEl);
    }
    card.appendChild(row);
    card.appendChild(widget.statusEl);
    card.appendChild(widget.promoPicker);
    if (analysisCtl) card.appendChild(analysisCtl.topLinesEl);
    card.appendChild(engineUnavailableNote());

    var moveListEl = null;
    var prevBtn = null;
    var nextBtn = null;

    function gotoStep(step) {
      currentStep = clamp(step, 0, moveObjs.length);
      widget.setFen(positions[currentStep]);
      exploredMoves = [];
      if (analysisCtl) analysisCtl.refresh();
      renderMoveList();
      prevBtn.disabled = currentStep === 0;
      nextBtn.disabled = currentStep === moveObjs.length;
    }

    function renderMoveList() {
      moveListEl.innerHTML = '';
      var startPly = (block.line && block.line.startPly) || 0;
      for (var i = 0; i < moveObjs.length; i++) {
        var pairEl = document.createElement('span');
        pairEl.className = 'move-pair';
        var isWhiteMove = (startPly + i) % 2 === 0;
        if (isWhiteMove) {
          var num = document.createElement('span');
          num.className = 'move-num';
          num.textContent = (Math.floor((startPly + i) / 2) + 1) + '.';
          pairEl.appendChild(num);
        }
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'move-chip' + (i + 1 === currentStep ? ' current' : '');
        chip.textContent = moveObjs[i].san;
        chip.addEventListener('click', (function (idx) { return function () { gotoStep(idx + 1); }; })(i));
        pairEl.appendChild(chip);
        moveListEl.appendChild(pairEl);
      }
    }

    if (block.line && Array.isArray(block.line.moves) && block.line.moves.length) {
      var replay = Chess(block.fen);
      positions = [block.fen];
      moveObjs = [];
      block.line.moves.forEach(function (san) {
        var result = replay.move(san, { sloppy: true });
        if (result) { moveObjs.push(result); positions.push(replay.fen()); }
      });

      var controls = document.createElement('div');
      controls.className = 'board-controls';
      prevBtn = document.createElement('button');
      prevBtn.type = 'button'; prevBtn.className = 'board-btn'; prevBtn.textContent = '‹ Prev';
      prevBtn.setAttribute('aria-label', 'Previous move in the line');
      nextBtn = document.createElement('button');
      nextBtn.type = 'button'; nextBtn.className = 'board-btn'; nextBtn.textContent = 'Next ›';
      nextBtn.setAttribute('aria-label', 'Next move in the line');
      controls.appendChild(prevBtn);
      controls.appendChild(nextBtn);
      card.appendChild(controls);

      moveListEl = document.createElement('div');
      moveListEl.className = 'move-list';
      card.appendChild(moveListEl);

      prevBtn.addEventListener('click', function () { gotoStep(currentStep - 1); });
      nextBtn.addEventListener('click', function () { gotoStep(currentStep + 1); });
      card.setAttribute('tabindex', '0');
      card.addEventListener('keydown', function (ev) {
        if (ev.key === 'ArrowLeft') { ev.preventDefault(); gotoStep(currentStep - 1); }
        else if (ev.key === 'ArrowRight') { ev.preventDefault(); gotoStep(currentStep + 1); }
      });
      gotoStep(0);
    }

    if (block.interactive) {
      var resetBtn = document.createElement('button');
      resetBtn.type = 'button';
      resetBtn.className = 'board-btn';
      resetBtn.textContent = 'Reset to position';
      resetBtn.addEventListener('click', function () {
        var basePos = positions ? positions[currentStep] : block.fen;
        widget.setFen(basePos);
        exploredMoves = [];
        if (analysisCtl) analysisCtl.refresh();
      });
      var resetRow = document.createElement('div');
      resetRow.className = 'board-controls';
      resetRow.appendChild(resetBtn);
      card.appendChild(resetRow);
    }

    if (block.caption) {
      var cap = document.createElement('p');
      cap.className = 'board-caption';
      escapeText(cap, block.caption);
      card.appendChild(cap);
    }

    wrap.appendChild(card);
    return wrap;
  }

  function renderCompareSide(side, orientation) {
    var col = document.createElement('div');
    var label = document.createElement('div');
    label.className = 'compare-label';
    escapeText(label, side.label || '');
    col.appendChild(label);

    var card = document.createElement('div');
    card.className = 'board-card';
    var widget = createBoardWidget({ fen: side.fen, orientation: orientation, interactive: false, ariaPrefix: side.label || 'Position' });
    card.appendChild(widget.el);
    if (side.caption) {
      var cap = document.createElement('p');
      cap.className = 'board-caption';
      escapeText(cap, side.caption);
      card.appendChild(cap);
    }
    col.appendChild(card);

    var evalEl = document.createElement('div');
    evalEl.className = 'compare-eval';
    if (typeof side.evalCp === 'number') {
      evalEl.textContent = fmtScore(side.evalCp, null);
    } else {
      evalEl.textContent = '…';
      analyzeOnce(side.fen, 14).then(function (result) {
        evalEl.textContent = result ? (fmtScore(result.cpWhite, result.mateWhite) + '  (live, d' + result.depth + ')') : '';
      });
    }
    col.appendChild(evalEl);
    return col;
  }

  function renderCompareBlock(block, ctx) {
    var wrap = createBlockWrapper('block-compare', ctx, 'compare');
    var grid = document.createElement('div');
    grid.className = 'compare-grid';
    grid.appendChild(renderCompareSide(block.left || {}, block.orientation || 'white'));
    grid.appendChild(renderCompareSide(block.right || {}, block.orientation || 'white'));
    wrap.appendChild(grid);
    if (block.note) {
      var note = document.createElement('div');
      note.className = 'compare-note';
      renderMarkdownInto(note, block.note);
      wrap.appendChild(note);
    }
    return wrap;
  }

  // =====================================================================
  // Exercise block. The load-bearing rule from the design spec: the eval
  // bar / top-lines panel for this block's board are created HIDDEN
  // (`startHidden: true`) and only ever revealed from inside `commit()`,
  // below — never left to the authored data to opt in or out of, so a
  // puzzle can never accidentally degrade into "read the bar".
  // =====================================================================

  function normalizeAnswerText(s) {
    return String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g, ' ');
  }

  function findMatchingAnswer(block, learnerValue) {
    var answers = block.answers || [];
    if (block.mode === 'move') {
      for (var i = 0; i < answers.length; i++) {
        if (answers[i].move && movesEquivalent(block.fen, learnerValue, answers[i].move)) return answers[i];
      }
    } else if (block.mode === 'text') {
      var norm = normalizeAnswerText(learnerValue);
      for (var j = 0; j < answers.length; j++) {
        if (answers[j].text && normalizeAnswerText(answers[j].text) === norm) return answers[j];
      }
    } else if (block.mode === 'choice') {
      for (var k = 0; k < answers.length; k++) {
        if (answers[k].option === learnerValue) return answers[k];
      }
    }
    return null;
  }

  function renderExerciseBlock(block, ctx) {
    var wrap = createBlockWrapper('block-exercise', ctx, 'exercise');
    var question = document.createElement('p');
    question.className = 'exercise-question';
    setInlineMarkdown(question, block.question);
    wrap.appendChild(question);

    var card = document.createElement('div');
    card.className = 'board-card';
    var row = document.createElement('div');
    row.className = 'board-row';

    var attempt = 0;
    var solved = false;
    var hintIndex = 0;

    var widget = createBoardWidget({
      fen: block.fen,
      orientation: block.orientation,
      interactive: block.mode === 'move',
      ariaPrefix: 'Exercise board',
      onMove: function (result) {
        if (solved) return;
        commit(result.san, result.san);
      },
    });
    row.appendChild(widget.el);

    var analysisCtl = attachLiveAnalysis(widget, { depth: 18, multipv: 3, startHidden: true });
    row.appendChild(analysisCtl.evalBarEl);
    card.appendChild(row);
    card.appendChild(widget.statusEl);
    card.appendChild(widget.promoPicker);
    card.appendChild(analysisCtl.topLinesEl);
    card.appendChild(engineUnavailableNote());
    wrap.appendChild(card);

    // --- mode-specific input ---
    if (block.mode === 'text') {
      var form = document.createElement('form');
      form.className = 'exercise-text-form';
      var input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Your answer…';
      input.autocomplete = 'off';
      var submitBtn = document.createElement('button');
      submitBtn.type = 'submit';
      submitBtn.textContent = 'Check';
      form.appendChild(input);
      form.appendChild(submitBtn);
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        if (solved || !input.value.trim()) return;
        commit(input.value.trim(), input.value.trim());
      });
      wrap.appendChild(form);
    } else if (block.mode === 'choice') {
      var optionsWrap = document.createElement('div');
      optionsWrap.className = 'exercise-options';
      (block.options || []).forEach(function (optionText) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'exercise-option';
        setInlineMarkdown(btn, optionText);
        btn.addEventListener('click', function () {
          if (solved) return;
          commit(optionText, optionText);
        });
        optionsWrap.appendChild(btn);
      });
      wrap.appendChild(optionsWrap);
    }
    // mode === 'move' has no separate input — moves are played on the board.

    var attemptNote = document.createElement('p');
    attemptNote.className = 'attempt-note';
    attemptNote.hidden = true;
    wrap.appendChild(attemptNote);

    var feedbackEl = document.createElement('div');
    feedbackEl.className = 'exercise-feedback';
    feedbackEl.hidden = true;
    wrap.appendChild(feedbackEl);

    var engineFallbackEl = document.createElement('div');
    engineFallbackEl.className = 'exercise-engine-fallback';
    engineFallbackEl.hidden = true;
    wrap.appendChild(engineFallbackEl);

    var explanationEl = document.createElement('div');
    explanationEl.className = 'exercise-explanation';
    explanationEl.hidden = true;
    wrap.appendChild(explanationEl);

    // --- hint ladder ---
    if (Array.isArray(block.hints) && block.hints.length) {
      var hintLadder = document.createElement('div');
      hintLadder.className = 'hint-ladder';
      var hintBtn = document.createElement('button');
      hintBtn.type = 'button';
      hintBtn.className = 'hint-btn';
      hintBtn.textContent = 'Hint (' + block.hints.length + ')';
      hintLadder.appendChild(hintBtn);
      wrap.appendChild(hintLadder);
      hintBtn.addEventListener('click', function () {
        if (hintIndex >= block.hints.length) return;
        var hintEl = document.createElement('div');
        hintEl.className = 'hint-item';
        setInlineMarkdown(hintEl, block.hints[hintIndex]);
        hintLadder.insertBefore(hintEl, hintBtn);
        emitEvent('hint-revealed', ctx.sectionId, ctx.blockIndex, { index: hintIndex });
        hintIndex += 1;
        hintBtn.textContent = hintIndex >= block.hints.length ? 'No more hints' : 'Hint (' + (block.hints.length - hintIndex) + ' left)';
        hintBtn.disabled = hintIndex >= block.hints.length;
      });
    }

    function revealExplanation() {
      if (block.explanation) {
        explanationEl.hidden = false;
        renderMarkdownInto(explanationEl, block.explanation);
      }
      if (block.engineLine) {
        var line = document.createElement('p');
        line.className = 'exercise-engine-fallback';
        line.textContent = 'Authored engine line: ' + block.engineLine;
        wrap.appendChild(line);
      }
    }

    function showEngineFallback(playedFen, playedLabel) {
      engineFallbackEl.hidden = false;
      engineFallbackEl.textContent = 'Not one of the lines I anticipated — checking with the engine…';
      Promise.all([analyzeOnce(block.fen, 18), playedFen ? analyzeOnce(playedFen, 18) : Promise.resolve(null)]).then(function (results) {
        var bestInfo = results[0];
        var playedInfo = results[1];
        var parts = [];
        if (bestInfo) {
          parts.push('Engine best from here: ' + (bestInfo.best ? uciPvToSan(block.fen, [bestInfo.best]) : '?') + '  ' + fmtScore(bestInfo.cpWhite, bestInfo.mateWhite) + '  d' + bestInfo.depth + '.');
        }
        if (playedInfo && playedLabel) {
          parts.push('Your move (' + playedLabel + '): ' + fmtScore(playedInfo.cpWhite, playedInfo.mateWhite) + '  d' + playedInfo.depth + '.');
        }
        engineFallbackEl.textContent = parts.join(' ') || 'The live engine is unavailable, so no automatic comparison here — ask the coach if you want to talk it through.';
      });
    }

    function commit(learnerValue, displayLabel) {
      attempt += 1;
      attemptNote.hidden = false;
      attemptNote.textContent = 'Attempt ' + attempt;

      var matched = findMatchingAnswer(block, learnerValue);
      var postMoveFen = block.mode === 'move' ? widget.getFen() : null;

      emitEvent('exercise-attempted', ctx.sectionId, ctx.blockIndex, {
        answer: learnerValue,
        matched: !!matched,
        correct: matched ? !!matched.correct : false,
        attempt: attempt,
      });

      analysisCtl.setHidden(false);
      analysisCtl.refresh();

      feedbackEl.hidden = false;
      engineFallbackEl.hidden = true;

      if (matched) {
        feedbackEl.className = 'exercise-feedback ' + (matched.correct ? 'correct' : 'incorrect');
        setInlineMarkdown(feedbackEl, matched.feedback || (matched.correct ? 'Correct.' : 'Not quite.'));
        if (matched.correct) {
          solved = true;
          if (block.mode === 'move') widget.setInteractive(false);
          revealExplanation();
          emitEvent('exercise-solved', ctx.sectionId, ctx.blockIndex, { answer: learnerValue, attempt: attempt });
          markSectionProgress(ctx.sectionId, 'done');
        } else if (block.mode === 'move') {
          setTimeout(function () { if (!solved) widget.setFen(block.fen); }, 900);
        }
      } else {
        feedbackEl.className = 'exercise-feedback fallback';
        feedbackEl.textContent = 'Not one of the lines I anticipated.';
        showEngineFallback(postMoveFen, displayLabel);
        revealExplanation();
      }
    }

    return wrap;
  }

  // =====================================================================
  // Game block: full PGN viewer — board, clickable move list, an SVG eval
  // graph across the whole game (white advantage above the midline, black
  // below, clamped to ±5 pawns, mate shown at the clamp), classification
  // dots for blunder/mistake/inaccuracy plies, and per-ply annotations.
  // =====================================================================

  function renderEvalGraph(game, block, onJump) {
    var svgNs = 'http://www.w3.org/2000/svg';
    var W = 600, H = 110, MID = H / 2;
    var svg = document.createElementNS(svgNs, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('class', 'eval-graph');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'Evaluation graph across the game — click to jump to a move');

    var evalByPly = {};
    (block.evalGraph || []).forEach(function (e) { evalByPly[e.ply] = e; });
    var n = game.moves.length;

    function xFor(ply) { return n <= 0 ? 0 : (ply / n) * W; }
    function yFor(entry) {
      var cp;
      if (entry && typeof entry.mate === 'number' && entry.mate !== null) {
        cp = entry.mate > 0 ? 500 : -500;
      } else {
        cp = clamp((entry && typeof entry.cp === 'number') ? entry.cp : 0, -500, 500);
      }
      return MID - (cp / 500) * MID;
    }

    var midline = document.createElementNS(svgNs, 'line');
    midline.setAttribute('x1', 0); midline.setAttribute('y1', MID);
    midline.setAttribute('x2', W); midline.setAttribute('y2', MID);
    midline.setAttribute('class', 'midline');
    svg.appendChild(midline);

    var points = [[0, MID]];
    for (var ply = 1; ply <= n; ply++) points.push([xFor(ply), yFor(evalByPly[ply])]);

    if (points.length > 1) {
      var areaPath = 'M0,' + MID + ' ' + points.map(function (p) { return 'L' + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + ' L' + W + ',' + MID + ' Z';
      var area = document.createElementNS(svgNs, 'path');
      area.setAttribute('d', areaPath);
      area.setAttribute('class', 'area-white');
      svg.appendChild(area);

      var line = document.createElementNS(svgNs, 'polyline');
      line.setAttribute('points', points.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '));
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke', 'var(--accent)');
      line.setAttribute('stroke-width', '1.5');
      svg.appendChild(line);
    }

    for (var i = 1; i <= n; i++) {
      var entry = evalByPly[i];
      if (entry && ['blunder', 'mistake', 'inaccuracy'].indexOf(entry.classification) >= 0) {
        var dot = document.createElementNS(svgNs, 'circle');
        dot.setAttribute('cx', xFor(i));
        dot.setAttribute('cy', yFor(entry));
        dot.setAttribute('r', '3.2');
        dot.setAttribute('fill', 'var(--eval-' + entry.classification + ')');
        dot.style.cursor = 'pointer';
        dot.setAttribute('role', 'button');
        dot.setAttribute('aria-label', entry.classification + ' at move ' + i);
        (function (targetPly) { dot.addEventListener('click', function (ev) { ev.stopPropagation(); onJump(targetPly); }); })(i);
        svg.appendChild(dot);
      }
    }

    var cursor = document.createElementNS(svgNs, 'line');
    cursor.setAttribute('class', 'cursor-line');
    cursor.setAttribute('y1', 0);
    cursor.setAttribute('y2', H);
    cursor.setAttribute('x1', 0);
    cursor.setAttribute('x2', 0);
    svg.appendChild(cursor);

    svg.addEventListener('click', function (ev) {
      var rect = svg.getBoundingClientRect();
      var ratio = rect.width ? (ev.clientX - rect.left) / rect.width : 0;
      onJump(clamp(Math.round(ratio * n), 0, n));
    });

    return {
      el: svg,
      setCursor: function (ply) {
        var x = xFor(ply);
        cursor.setAttribute('x1', x);
        cursor.setAttribute('x2', x);
      },
    };
  }

  function renderGameBlock(block, ctx) {
    var wrap = createBlockWrapper('block-game', ctx, 'game');
    var game = parsePgn(block.pgn);
    var currentPly = 0;

    var card = document.createElement('div');
    card.className = 'board-card wide';

    if (block.headers && (block.headers.White || block.headers.Black)) {
      var head = document.createElement('p');
      head.className = 'board-caption';
      var whiteText = (block.headers.White || 'White') + ' vs ' + (block.headers.Black || 'Black') + (block.headers.Result ? (' · ' + block.headers.Result) : '');
      escapeText(head, whiteText);
      card.appendChild(head);
    }

    var row = document.createElement('div');
    row.className = 'board-row';
    var widget = createBoardWidget({ fen: game.positions[0], orientation: block.orientation, interactive: false, ariaPrefix: 'Game board' });
    row.appendChild(widget.el);
    card.appendChild(row);
    card.appendChild(widget.statusEl);

    var graphWrap = document.createElement('div');
    graphWrap.className = 'eval-graph-wrap';
    var graphApi = renderEvalGraph(game, block, function (ply) { jumpTo(ply); });
    graphWrap.appendChild(graphApi.el);
    card.appendChild(graphWrap);

    var moveListEl = document.createElement('div');
    moveListEl.className = 'move-list';
    card.appendChild(moveListEl);

    var annotationEl = document.createElement('div');
    annotationEl.className = 'annotation-note';
    annotationEl.hidden = true;
    card.appendChild(annotationEl);

    var evalByPly = {};
    (block.evalGraph || []).forEach(function (e) { evalByPly[e.ply] = e; });

    var startParts = (game.startFen || '').split(' ');
    var startColorWhite = startParts[1] !== 'b';
    var startMoveNumber = Number(startParts[5]) || 1;

    function renderMoveList() {
      moveListEl.innerHTML = '';
      var moveNumber = startMoveNumber;
      var colorWhite = startColorWhite;
      for (var i = 0; i < game.moves.length; i++) {
        var ply = i + 1;
        var pairEl = document.createElement('span');
        pairEl.className = 'move-pair';
        if (colorWhite) {
          var num = document.createElement('span');
          num.className = 'move-num';
          num.textContent = moveNumber + '.';
          pairEl.appendChild(num);
        }
        var entry = evalByPly[ply];
        var chip = document.createElement('button');
        chip.type = 'button';
        var chipClass = 'move-chip';
        if (ply === currentPly) chipClass += ' current';
        if (entry && ['blunder', 'mistake', 'inaccuracy'].indexOf(entry.classification) >= 0) chipClass += ' ' + entry.classification;
        chip.className = chipClass;
        chip.textContent = game.moves[i].san;
        chip.addEventListener('click', (function (targetPly) { return function () { jumpTo(targetPly); }; })(ply));
        pairEl.appendChild(chip);
        moveListEl.appendChild(pairEl);
        if (!colorWhite) moveNumber += 1;
        colorWhite = !colorWhite;
      }
    }

    function jumpTo(ply) {
      currentPly = clamp(ply, 0, game.moves.length);
      widget.setFen(game.positions[currentPly]);
      renderMoveList();
      graphApi.setCursor(currentPly);
      var ann = block.annotations && block.annotations[String(currentPly)];
      if (ann) { annotationEl.hidden = false; setInlineMarkdown(annotationEl, ann); }
      else { annotationEl.hidden = true; }
      emitEvent('line-explored', ctx.sectionId, ctx.blockIndex, { ply: currentPly, san: currentPly > 0 ? game.moves[currentPly - 1].san : null });
    }

    card.setAttribute('tabindex', '0');
    card.addEventListener('keydown', function (ev) {
      if (ev.key === 'ArrowLeft') { ev.preventDefault(); jumpTo(currentPly - 1); }
      else if (ev.key === 'ArrowRight') { ev.preventDefault(); jumpTo(currentPly + 1); }
    });

    renderMoveList();
    graphApi.setCursor(0);
    wrap.appendChild(card);
    return wrap;
  }

  // =====================================================================
  // Chapter assembly: header, sticky ToC / progress rail, sections, block
  // dispatch, section-viewed telemetry via IntersectionObserver, reading
  // progress, and a chapter-completed event fired once the learner
  // scrolls to (near) the end of the document.
  // =====================================================================

  function prefersReducedMotion() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function renderBlock(block, ctx) {
    if (!block || typeof block.type !== 'string') return null;
    switch (block.type) {
      case 'prose': return renderProseBlock(block, ctx);
      case 'callout': return renderCalloutBlock(block, ctx);
      case 'board': return renderBoardBlock(block, ctx);
      case 'game': return renderGameBlock(block, ctx);
      case 'exercise': return renderExerciseBlock(block, ctx);
      case 'compare': return renderCompareBlock(block, ctx);
      case 'quiz': return renderQuizBlock(block, ctx);
      case 'recap': return renderRecapBlock(block, ctx);
      default: {
        var warn = document.createElement('div');
        warn.className = 'block block-unknown';
        warn.textContent = 'Unrecognized block type: ' + block.type;
        return warn;
      }
    }
  }

  // Populated by buildChapter(); read by markSectionProgress and the
  // section IntersectionObserver. Declared with `var` so it's usable from
  // block renderers defined earlier in this file regardless of source
  // order (function/var hoisting within this IIFE's single scope).
  var sectionMetaRegistry = {};

  function markSectionProgress(sectionId, state) {
    var meta = sectionMetaRegistry[sectionId];
    if (!meta) return;
    if (state === 'done') {
      meta.done = true;
      meta.statusDot.className = 'toc-status done';
    } else if (state === 'visited' && !meta.done) {
      meta.viewed = true;
      meta.statusDot.className = 'toc-status visited';
    }
  }

  function setupSectionObserver(sections) {
    if (typeof IntersectionObserver === 'undefined') return;
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        var id = entry.target.getAttribute('data-section-id');
        var meta = sectionMetaRegistry[id];
        if (!meta) return;
        if (entry.isIntersecting) {
          meta.tocItem.classList.add('active');
          if (!meta.viewed) {
            meta.viewed = true;
            if (!meta.done) meta.statusDot.className = 'toc-status visited';
            emitEvent('section-viewed', id, null, {});
          }
        } else {
          meta.tocItem.classList.remove('active');
        }
      });
    }, { threshold: 0.3, rootMargin: '-10% 0px -55% 0px' });
    sections.forEach(function (section, i) {
      var id = section.id || ('section-' + i);
      var meta = sectionMetaRegistry[id];
      if (meta) observer.observe(meta.sectionEl);
    });
  }

  var chapterCompletedEmitted = false;
  function updateReadingProgress() {
    var doc = document.documentElement;
    var scrollTop = window.scrollY || doc.scrollTop || 0;
    var height = doc.scrollHeight - doc.clientHeight;
    var pct = height > 0 ? clamp((scrollTop / height) * 100, 0, 100) : 0;
    var fill = document.getElementById('reading-progress-fill');
    if (fill) fill.style.width = pct + '%';
    if (pct > 96 && !chapterCompletedEmitted && Object.keys(sectionMetaRegistry).length) {
      chapterCompletedEmitted = true;
      emitEvent('chapter-completed', null, null, {});
    }
  }
  window.addEventListener('scroll', updateReadingProgress, { passive: true });
  window.addEventListener('resize', updateReadingProgress);

  function buildChapter(data) {
    document.title = 'Studio — ' + (data.title || 'Chapter');
    escapeText(document.getElementById('c-title'), data.title || 'Chapter');

    var subtitleEl = document.getElementById('c-subtitle');
    if (data.subtitle) { subtitleEl.hidden = false; escapeText(subtitleEl, data.subtitle); }
    else { subtitleEl.hidden = true; }

    var minutesEl = document.getElementById('c-minutes');
    if (data.estimatedMinutes) { minutesEl.hidden = false; minutesEl.textContent = '~' + data.estimatedMinutes + ' min'; }
    else { minutesEl.hidden = true; }

    var provEl = document.getElementById('c-provenance');
    if (data.provenance) {
      var p = data.provenance;
      var bits = [];
      if (p.engine) bits.push(p.engine);
      if (typeof p.depth === 'number') bits.push('depth ' + p.depth);
      if (p.source) bits.push(p.source);
      if (p.generatedAt) bits.push('generated ' + p.generatedAt);
      provEl.hidden = bits.length === 0;
      provEl.textContent = bits.join(' · ');
    } else {
      provEl.hidden = true;
    }

    var tocEl = document.getElementById('c-toc');
    var contentEl = document.getElementById('c-content');
    tocEl.innerHTML = '';
    contentEl.innerHTML = '';
    sectionMetaRegistry = {};
    chapterCompletedEmitted = false;

    var sections = Array.isArray(data.sections) ? data.sections : [];

    sections.forEach(function (section, sIndex) {
      var sectionId = section.id || ('section-' + sIndex);

      var tocItem = document.createElement('button');
      tocItem.type = 'button';
      tocItem.className = 'toc-item';
      var statusDot = document.createElement('span');
      statusDot.className = 'toc-status';
      var labelSpan = document.createElement('span');
      labelSpan.className = 'toc-label';
      escapeText(labelSpan, section.heading || ('Section ' + (sIndex + 1)));
      tocItem.appendChild(statusDot);
      tocItem.appendChild(labelSpan);
      tocItem.addEventListener('click', function () {
        var target = sectionMetaRegistry[sectionId].sectionEl;
        target.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'start' });
      });
      tocEl.appendChild(tocItem);

      var sectionEl = document.createElement('section');
      sectionEl.className = 'section';
      sectionEl.id = 'sec-' + sectionId;
      sectionEl.setAttribute('data-section-id', sectionId);
      var heading = document.createElement('h2');
      heading.className = 'section-heading';
      escapeText(heading, section.heading || '');
      sectionEl.appendChild(heading);

      (Array.isArray(section.blocks) ? section.blocks : []).forEach(function (block, bIndex) {
        var ctx = { sectionId: sectionId, sectionHeading: section.heading || '', blockIndex: bIndex };
        var blockEl = renderBlock(block, ctx);
        if (blockEl) sectionEl.appendChild(blockEl);
      });

      contentEl.appendChild(sectionEl);
      sectionMetaRegistry[sectionId] = {
        tocItem: tocItem, statusDot: statusDot, sectionEl: sectionEl,
        viewed: false, done: false, index: sIndex,
      };
    });

    setupSectionObserver(sections);
  }

  // =====================================================================
  // Boot: hydrate the conversation panel, subscribe to live events, load
  // the chapter payload, and start booting the engine (lazily — the first
  // analyzable board to become visible will also trigger this, but kicking
  // it off here means the multithreaded/single-thread feature detection
  // and fallback has a head start before the learner reaches a board).
  // =====================================================================

  function onState(data) {
    // A live state push carrying a full chapter payload (`sections`
    // present) rebuilds the page in place, e.g. the agent authoring a
    // follow-up section without a full reload. Anything else is ignored —
    // chapter-shell has no other live-state fields today.
    if (data && Array.isArray(data.sections)) {
      buildChapter(data);
      updateReadingProgress();
    }
  }

  async function loadData() {
    try {
      var res = await fetch('/data');
      if (res.ok) {
        var data = await res.json();
        buildChapter(data);
        updateReadingProgress();
      }
    } catch (err) {
      console.error('Could not load /data', err);
    }
  }

  hydrateTranscript();
  subscribeEvents(onState);
  loadData();
  Engine.boot();
})();
</script>
</body>
</html>
